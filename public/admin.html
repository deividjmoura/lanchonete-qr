<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin · Lanchonete QR</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-tabs{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap}
    .admin-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
    .admin-tabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
    .admin-section{display:none}
    .admin-section.active{display:block}
    .mesa-card .token{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;word-break:break-all;color:var(--muted)}
    .mesa-card .url{font-size:.85rem;margin:8px 0 12px;word-break:break-all}
    .badge-livre{background:#e8f5e9;color:#1b5e20}
    .badge-ocupada{background:#fff3e0;color:#e65100}
    .prod-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
    .prod-row:last-child{border-bottom:0}
    .prod-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .chip{font-size:.75rem;background:#f3f4f6;border-radius:999px;padding:3px 10px;color:var(--muted)}
    .chip.on{background:#e8f5e9;color:#1b5e20}
    .chip.off{background:#fce8e6;color:#b71c1c}
    .edit-panel{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
    .edit-panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .edit-panel .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .form-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}
    .form-inline label{margin:0}
    .form-inline input,.form-inline select{width:auto;min-width:120px}
    .toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}
    @media (max-width:640px){.edit-panel .grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <div class="brand">⚙️ Admin</div>
      <div class="muted">Cardápio, mesas e QR Codes · Postgres</div>
    </div>
    <div class="nav">
      <a class="btn" href="/cozinha">Cozinha</a>
      <a class="btn dark" href="/">Início</a>
    </div>
  </div>

  <div class="admin-tabs">
    <button type="button" class="active" data-tab="mesas">Mesas & QR</button>
    <button type="button" data-tab="cardapio">Cardápio</button>
  </div>

  <section id="sec-mesas" class="admin-section active">
    <div class="panel">
      <h2>Mesas</h2>
      <p class="muted">Cada mesa tem um token UUID opaco. Use a URL com o token no QR — nunca o número sequencial.</p>
      <div id="mesas" class="qrgrid" style="margin-top:18px"></div>
    </div>
  </section>

  <section id="sec-cardapio" class="admin-section">
    <div class="panel" style="margin-bottom:18px">
      <h2>Nova categoria</h2>
      <div class="form-inline">
        <div>
          <label for="catNome">Nome</label>
          <input id="catNome" placeholder="Ex.: Bebidas">
        </div>
        <div>
          <label for="catOrdem">Ordem</label>
          <input id="catOrdem" type="number" value="0" style="width:80px">
        </div>
        <button class="btn primary" type="button" onclick="criarCat()">Adicionar</button>
      </div>
    </div>

    <div class="panel" style="margin-bottom:18px">
      <h2>Novo produto</h2>
      <div class="form-inline">
        <div>
          <label for="prodCat">Categoria</label>
          <select id="prodCat"></select>
        </div>
        <div>
          <label for="prodNome">Nome</label>
          <input id="prodNome" placeholder="Ex.: X-Burger">
        </div>
        <div>
          <label for="prodPreco">Preço</label>
          <input id="prodPreco" type="number" step="0.01" min="0" placeholder="0.00" style="width:100px">
        </div>
        <div>
          <label><input type="checkbox" id="prodPonto"> Ponto da carne</label>
        </div>
        <button class="btn primary" type="button" onclick="criarProd()">Adicionar</button>
      </div>
    </div>

    <div id="cardapio"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const host = location.origin;
const br = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

document.querySelectorAll('.admin-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
  });
});

async function loadMesas() {
  const mesas = await (await fetch('/api/admin/mesas')).json();
  const el = document.getElementById('mesas');
  if (!mesas.length) {
    el.innerHTML = '<div class="panel">Nenhuma mesa no banco. Rode o seed.</div>';
    return;
  }
  el.innerHTML = mesas.map(m => {
    const url = host + '/mesa/' + m.token;
    const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    const badge = m.sessaoAberta
      ? '<span class="badge badge-ocupada">ocupada · ' + br(m.valorTotal || 0) + '</span>'
      : '<span class="badge badge-livre">livre</span>';
    return '<article class="panel qr mesa-card">' +
      '<h2>Mesa ' + m.numero + '</h2>' + badge +
      '<img src="' + qrSrc + '" alt="QR Mesa ' + m.numero + '" width="220" height="220" loading="lazy">' +
      '<p class="url"><a href="' + url + '" target="_blank" rel="noopener">' + esc(url) + '</a></p>' +
      '<p class="token">' + esc(m.token) + '</p>' +
      '<button class="btn primary" type="button" onclick="navigator.clipboard.writeText(\'' + url + '\').then(()=>toast(\'Link copiado\'))">Copiar link</button>' +
      '</article>';
  }).join('');
}

let cardapioCache = [];

async function loadCardapio() {
  cardapioCache = await (await fetch('/api/admin/cardapio')).json();
  const sel = document.getElementById('prodCat');
  sel.innerHTML = cardapioCache.map(c => '<option value="' + c.id + '">' + esc(c.nome) + '</option>').join('');

  const root = document.getElementById('cardapio');
  if (!cardapioCache.length) {
    root.innerHTML = '<div class="panel">Nenhuma categoria. Crie uma acima.</div>';
    return;
  }

  root.innerHTML = cardapioCache.map(cat => {
    const prods = cat.produtos.length
      ? cat.produtos.map(p => renderProduto(p)).join('')
      : '<p class="muted">Nenhum produto nesta categoria.</p>';
    return '<div class="panel" style="margin-bottom:16px">' +
      '<div class="row"><h2 style="margin:0">' + esc(cat.nome) + '</h2>' +
      '<span class="muted">ordem ' + cat.ordem + '</span></div>' + prods + '</div>';
  }).join('');
}

function renderProduto(p) {
  const statusChip = p.disponivel
    ? '<span class="chip on">disponível</span>'
    : '<span class="chip off">indisponível</span>';
  const pontoChip = p.pedePontoCarne ? '<span class="chip">ponto da carne</span>' : '';
  const adds = (p.adicionais || []).map(a => esc(a.nome) + ' (' + br(a.preco) + ')').join(', ') || '—';
  const rems = (p.removiveis || []).join(', ') || '—';

  const addRows = (p.adicionais || []).map(a =>
    '<div class="row" style="margin-bottom:6px"><span>' + esc(a.nome) + ' · ' + br(a.preco) + '</span>' +
    '<button class="btn" type="button" style="padding:4px 10px" onclick="delAdd(' + a.id + ')">Remover</button></div>'
  ).join('') || '<p class="muted">Nenhum.</p>';

  return '<div class="prod-row" id="prod-' + p.id + '"><div>' +
    '<strong>' + esc(p.nome) + '</strong> · <span class="price">' + br(p.preco) + '</span>' +
    '<div class="prod-meta">' + statusChip + pontoChip + '<span class="chip">#' + p.id + '</span></div>' +
    (p.descricao ? '<p class="muted" style="margin:6px 0 0;font-size:.9rem">' + esc(p.descricao) + '</p>' : '') +
    '<p class="muted" style="margin:6px 0 0;font-size:.85rem"><b>Adicionais:</b> ' + adds + '</p>' +
    '<p class="muted" style="margin:2px 0 0;font-size:.85rem"><b>Removíveis:</b> ' + rems + '</p>' +
    '<div class="edit-panel" id="edit-' + p.id + '" style="display:none">' +
    '<div class="grid2"><div><label>Nome</label><input id="e-nome-' + p.id + '" value="' + esc(p.nome) + '"></div>' +
    '<div><label>Preço</label><input id="e-preco-' + p.id + '" type="number" step="0.01" min="0" value="' + p.preco + '"></div></div>' +
    '<div style="margin-top:10px"><label>Descrição</label><textarea id="e-desc-' + p.id + '">' + esc(p.descricao || '') + '</textarea></div>' +
    '<div class="form-inline" style="margin-top:10px">' +
    '<label><input type="checkbox" id="e-disp-' + p.id + '"' + (p.disponivel ? ' checked' : '') + '> Disponível</label>' +
    '<label><input type="checkbox" id="e-ponto-' + p.id + '"' + (p.pedePontoCarne ? ' checked' : '') + '> Ponto da carne</label></div>' +
    '<div class="actions"><button class="btn primary" type="button" onclick="salvarProd(' + p.id + ')">Salvar</button>' +
    '<button class="btn" type="button" onclick="toggleEdit(' + p.id + ')">Cancelar</button></div><hr>' +
    '<h3 style="font-size:1rem;margin-bottom:8px">Adicionais</h3><div id="adds-' + p.id + '">' + addRows + '</div>' +
    '<div class="form-inline"><input id="add-nome-' + p.id + '" placeholder="Nome do adicional">' +
    '<input id="add-preco-' + p.id + '" type="number" step="0.01" min="0" placeholder="Preço" style="width:90px">' +
    '<button class="btn primary" type="button" onclick="addAdd(' + p.id + ')">+ Adicional</button></div><hr>' +
    '<h3 style="font-size:1rem;margin-bottom:8px">Ingredientes removíveis</h3>' +
    '<input id="rems-' + p.id + '" value="' + esc((p.removiveis || []).join(', ')) + '" placeholder="queijo, alface, tomate">' +
    '<div class="actions"><button class="btn primary" type="button" onclick="salvarRems(' + p.id + ')">Salvar removíveis</button></div>' +
    '</div></div><div>' +
    '<button class="btn" type="button" onclick="toggleEdit(' + p.id + ')">Editar</button>' +
    '<button class="btn ' + (p.disponivel ? '' : 'primary') + '" type="button" style="margin-top:8px;width:100%"' +
    ' onclick="toggleDisp(' + p.id + ', ' + (!p.disponivel) + ')">' + (p.disponivel ? 'Pausar' : 'Ativar') + '</button>' +
    '</div></div>';
}

function toggleEdit(id) {
  const el = document.getElementById('edit-' + id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function criarCat() {
  const nome = document.getElementById('catNome').value.trim();
  const ordem = Number(document.getElementById('catOrdem').value) || 0;
  if (!nome) return toast('Informe o nome');
  const r = await fetch('/api/admin/categorias', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, ordem }),
  });
  const data = await r.json();
  if (!r.ok) return toast(data.error || 'Erro');
  document.getElementById('catNome').value = '';
  toast('Categoria criada');
  loadCardapio();
}

async function criarProd() {
  const categoriaId = Number(document.getElementById('prodCat').value);
  const nome = document.getElementById('prodNome').value.trim();
  const preco = Number(document.getElementById('prodPreco').value);
  const pedePontoCarne = document.getElementById('prodPonto').checked;
  if (!nome || Number.isNaN(preco)) return toast('Nome e preço obrigatórios');
  const r = await fetch('/api/admin/produtos', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ categoriaId, nome, preco, pedePontoCarne }),
  });
  const data = await r.json();
  if (!r.ok) return toast(data.error || 'Erro');
  document.getElementById('prodNome').value = '';
  document.getElementById('prodPreco').value = '';
  document.getElementById('prodPonto').checked = false;
  toast('Produto criado');
  loadCardapio();
}

async function salvarProd(id) {
  const body = {
    nome: document.getElementById('e-nome-' + id).value.trim(),
    preco: Number(document.getElementById('e-preco-' + id).value),
    descricao: document.getElementById('e-desc-' + id).value.trim(),
    disponivel: document.getElementById('e-disp-' + id).checked,
    pedePontoCarne: document.getElementById('e-ponto-' + id).checked,
  };
  const r = await fetch('/api/admin/produtos/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) return toast(data.error || 'Erro');
  toast('Produto atualizado');
  loadCardapio();
}

async function toggleDisp(id, disponivel) {
  const r = await fetch('/api/admin/produtos/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ disponivel }),
  });
  if (!r.ok) { const data = await r.json(); return toast(data.error || 'Erro'); }
  toast(disponivel ? 'Produto ativado' : 'Produto pausado');
  loadCardapio();
}

async function addAdd(produtoId) {
  const nome = document.getElementById('add-nome-' + produtoId).value.trim();
  const preco = Number(document.getElementById('add-preco-' + produtoId).value);
  if (!nome || Number.isNaN(preco)) return toast('Nome e preço do adicional');
  const r = await fetch('/api/admin/produtos/' + produtoId + '/adicionais', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, preco }),
  });
  const data = await r.json();
  if (!r.ok) return toast(data.error || 'Erro');
  toast('Adicional criado');
  loadCardapio();
}

async function delAdd(id) {
  if (!confirm('Remover este adicional?')) return;
  const r = await fetch('/api/admin/adicionais/' + id, { method: 'DELETE' });
  if (!r.ok) { const data = await r.json(); return toast(data.error || 'Erro'); }
  toast('Adicional removido');
  loadCardapio();
}

async function salvarRems(produtoId) {
  const raw = document.getElementById('rems-' + produtoId).value;
  const ingredientes = raw.split(',').map(s => s.trim()).filter(Boolean);
  const r = await fetch('/api/admin/produtos/' + produtoId + '/removiveis', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ingredientes }),
  });
  const data = await r.json();
  if (!r.ok) return toast(data.error || 'Erro');
  toast('Removíveis atualizados');
  loadCardapio();
}

loadMesas();
loadCardapio();
</script>
</body>
</html>
