<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR das mesas</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><div class="top"><div><div class="brand">📱 QRs das mesas</div><div class="muted">Imprima um QR por mesa</div></div><a class="btn dark" href="/mesa/1">Cardápio</a></div><div id="qrs" class="qrgrid" style="margin-top:24px"></div></main><script>let host=location.origin;document.getElementById('qrs').innerHTML=Array.from({length:12},(_,i)=>i+1).map(n=>`<article class="panel qr"><h2>Mesa ${n}</h2><img src="/qr/mesa-${n}.png"><p class="muted">${host}/mesa/${n}</p><button class="btn primary" onclick="print()">Imprimir</button></article>`).join('')</script></body></html>
