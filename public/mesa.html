<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Cardápio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    /* ===== Página cliente: lousa ===== */
    body.board-page{
      background:#1c1c1c;
      min-height:100vh;
    }
    body.board-page .board{
      max-width:560px;margin:0 auto;
      padding:20px 16px 130px;
    }
    .board-header{
      text-align:center;margin-bottom:18px;
    }
    .board-header .menu-title{
      font-family:"Special Elite",Kalam,cursive;
      font-size:clamp(2.4rem,10vw,3.4rem);
      color:#f0ebe0;letter-spacing:.12em;
      text-shadow:0 2px 0 rgba(0,0,0,.4);
      margin:0;line-height:1;
    }
    .board-header .mesa-line{
      font-family:Kalam,cursive;color:#c8bfa8;
      font-size:1.05rem;margin-top:4px;
    }
    .board-frame{
      border:2px solid rgba(240,235,224,.22);
      border-radius:8px;
      padding:8px 6px 16px;
      background:
        radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.03),transparent 50%),
        linear-gradient(180deg,#222 0%,#1a1a1a 100%);
      box-shadow:inset 0 0 40px rgba(0,0,0,.35);
    }

    /* Acordeão de categorias estilo giz */
    .chalk-cat{border-bottom:1px dashed rgba(240,235,224,.18)}
    .chalk-cat:last-child{border-bottom:0}
    .chalk-cat__head{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:16px 12px;border:0;background:transparent;cursor:pointer;text-align:left;
      font-family:Kalam,cursive;color:#f0ebe0;font-size:1.35rem;font-weight:700;
      letter-spacing:.04em;
    }
    .chalk-cat__head:hover{color:#fff}
    .chalk-cat__head .chev{
      font-size:.9rem;opacity:.6;transition:transform .25s ease;
    }
    .chalk-cat.open .chalk-cat__head .chev{transform:rotate(180deg)}
    .chalk-cat__body{
      display:none;padding:0 10px 16px;
    }
    .chalk-cat.open .chalk-cat__body{display:block}

    .chalk-item{
      border:1px solid rgba(240,235,224,.12);
      border-radius:10px;padding:12px;
      margin-bottom:10px;
      background:rgba(255,255,255,.03);
    }
    .chalk-item h3{
      margin:0 0 4px;font-family:Kalam,cursive;
      color:#f5f0e6;font-size:1.15rem;font-weight:700;
    }
    .chalk-item .desc{
      margin:0 0 10px;color:#a89f8c;font-size:.88rem;line-height:1.35;
    }
    .chalk-item .row{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
    }
    .chalk-item .price{
      font-family:var(--font-mono);color:#f0d78c;font-weight:700;font-size:1rem;
    }
    .chalk-item .btn{
      min-height:36px;padding:0 12px;font-size:.82rem;border-radius:999px;
    }
    .chalk-item .btn.ghost{
      background:transparent;border:1px solid rgba(240,235,224,.35);color:#f0ebe0;
    }
    .chalk-item .btn.primary{background:#c45c26;border-color:#c45c26;color:#fff}
    .chalk-item .btn.primary:hover{filter:brightness(1.08)}

    .board-tools{
      display:flex;justify-content:center;gap:10px;margin:14px 0 0;flex-wrap:wrap;
    }
    .board-tools .btn{
      min-height:38px;padding:0 14px;border-radius:999px;font-size:.85rem;
      background:rgba(255,255,255,.08);border:1px solid rgba(240,235,224,.25);color:#f0ebe0;
    }
    .board-tools .btn.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}

    /* ===== Sanduíche realista (inspirado CodePen) ===== */
    .burger-dock{
      position:fixed !important;left:0;right:0;bottom:0;
      padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));
      z-index:50;display:flex;flex-direction:column;align-items:center;gap:4px;
      pointer-events:none;transform:none !important;
    }
    .burger-dock .burger-btn,.burger-dock .burger-hint{pointer-events:auto}
    .burger-btn{
      position:relative;width:72px;height:64px;
      border:0;background:transparent;cursor:pointer;padding:0;
      display:inline-flex;align-items:center;justify-content:center;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));
      transition:transform .15s ease;
    }
    .burger-btn:active{transform:scale(.95)}
    .burger-btn:focus-visible{outline:2px solid #f0d78c;outline-offset:4px}
    .burger-btn .badge-count{
      position:absolute;top:-2px;right:-6px;z-index:2;
      min-width:22px;height:22px;padding:0 6px;border-radius:999px;
      background:#c45c26;color:#fff;font-size:.7rem;font-weight:800;
      display:none;align-items:center;justify-content:center;
    }
    .burger-btn .badge-count.show{display:inline-flex}

    /* camadas do sanduíche */
    .sand{
      width:56px;height:48px;position:relative;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    }
    .sand .bun-top{
      width:52px;height:16px;border-radius:22px 22px 6px 6px;
      background:linear-gradient(180deg,#f0c98a 0%,#e0a85e 55%,#c98a45 100%);
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.15);
      position:relative;z-index:5;
      transition:transform .4s cubic-bezier(.2,.9,.2,1);
    }
    .sand .bun-top::before,.sand .bun-top::after{
      content:"";position:absolute;width:5px;height:3px;background:rgba(255,255,255,.45);
      border-radius:50%;top:4px;
    }
    .sand .bun-top::before{left:12px;transform:rotate(20deg)}
    .sand .bun-top::after{right:14px;transform:rotate(-25deg)}
    .sand .lettuce{
      width:56px;height:7px;border-radius:40% 60% 45% 55%;
      background:linear-gradient(90deg,#6bbf4e,#8fd66a 40%,#5aad3f);
      z-index:4;transition:transform .45s ease,opacity .3s;
    }
    .sand .tomato{
      width:46px;height:6px;border-radius:3px;
      background:linear-gradient(180deg,#ff5a4a,#d63a32);
      box-shadow:0 0 0 1px #b82e28;z-index:3;
      transition:transform .45s ease,opacity .3s;
    }
    .sand .cheese{
      width:50px;height:5px;
      background:linear-gradient(180deg,#ffd54a,#f0b429);
      clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);
      z-index:2;transition:transform .45s ease,opacity .3s;
    }
    .sand .patty{
      width:48px;height:10px;border-radius:5px;
      background:linear-gradient(180deg,#6b3e2a,#3d2214 60%,#2a160e);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);z-index:1;
      transition:transform .45s ease,opacity .3s;
    }
    .sand .bun-bot{
      width:52px;height:10px;border-radius:5px 5px 14px 14px;
      background:linear-gradient(180deg,#e8b87a,#c98a45);
      box-shadow:0 3px 6px rgba(0,0,0,.25);
      transition:transform .4s cubic-bezier(.2,.9,.2,1);
    }
    body.pedir-open .sand{gap:8px}
    body.pedir-open .sand .bun-top{transform:translateY(-8px)}
    body.pedir-open .sand .bun-bot{transform:translateY(8px)}
    body.pedir-open .sand .lettuce,
    body.pedir-open .sand .tomato,
    body.pedir-open .sand .cheese,
    body.pedir-open .sand .patty{opacity:0;transform:scale(.4)}

    .burger-hint{
      font-family:Kalam,cursive;font-size:.78rem;color:#c8bfa8;
      letter-spacing:.03em;
    }
    body.pedir-open .burger-hint{color:#f0ebe0}
    body.pedir-open .burger-dock{z-index:96}

    /* splash */
    .sauce-layer{position:fixed;inset:0;z-index:91;pointer-events:none;overflow:hidden}
    .fly-ing{position:absolute;border-radius:4px;opacity:0;transition:transform .55s cubic-bezier(.15,.85,.25,1),opacity .4s}
    .fly-ing.tomato{width:48px;height:10px;background:#e53935}
    .fly-ing.lettuce{width:56px;height:8px;background:#8bc34a;border-radius:6px}
    .fly-ing.cheese{width:50px;height:6px;background:#ffc107}
    .fly-ing.patty{width:46px;height:14px;background:#4e342e;border-radius:6px}
    .fly-ing.bun{width:52px;height:16px;background:#e4a667;border-radius:12px 12px 4px 4px}
    .fly-ing.settled{opacity:.5!important}
    .splash{position:absolute;border-radius:50% 40% 55% 45%;opacity:0;animation:splashLand .55s ease-out forwards}
    .splash.ketchup{background:#c62828}
    .splash.mustard{background:#f9a825}
    .splash.mayo{background:#fff8e1}
    .splash.settled{animation:none;opacity:.32}
    @keyframes splashLand{
      0%{transform:scale(.15);opacity:0}
      40%{opacity:.85}
      100%{transform:scale(1) rotate(28deg);opacity:.4}
    }

    /* Modal conta / carrinho / produto */
    .modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
    .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
    .modal-sheet{
      position:relative;z-index:1;width:min(100%,480px);
      max-height:min(92vh,720px);overflow:auto;
      background:#1f1f1f;color:#f0ebe0;
      border-radius:20px 20px 0 0;border:1px solid rgba(240,235,224,.15);border-bottom:0;
      padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
      animation:sheetUp .22s ease;
    }
    @keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
    .modal-sheet .close{
      position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;
      border:1px solid rgba(240,235,224,.2);background:rgba(255,255,255,.06);
      font-size:1.4rem;color:#c8bfa8;cursor:pointer;
    }
    .modal-sheet h2{margin:0 40px 6px 0;font-family:Kalam,cursive;font-size:1.4rem;color:#f0ebe0}
    .modal-sheet .muted{color:#a89f8c}
    .status-pill{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:700;
      letter-spacing:.03em;text-transform:uppercase;
    }
    .status-pill.recebido{background:rgba(59,130,246,.2);color:#93c5fd}
    .status-pill.em_producao{background:rgba(245,158,11,.2);color:#fcd34d}
    .status-pill.concluido{background:rgba(34,197,94,.2);color:#86efac}
    .status-pill.entregue{background:rgba(255,255,255,.08);color:#a89f8c}
    .pedido-block{
      border:1px solid rgba(240,235,224,.12);border-radius:14px;padding:14px;
      margin-bottom:12px;background:rgba(255,255,255,.04);
    }
    .pedido-block:last-child{margin-bottom:0}
    .pedido-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .pedido-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(240,235,224,.1);font-size:.9rem}
    .pedido-item:first-of-type{border-top:0;padding-top:0}
    .pedido-item small{display:block;color:#a89f8c;font-size:.78rem;margin-top:2px}
    .sessao-empty{text-align:center;padding:28px 12px;color:#a89f8c}
    .sessao-summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
    .sessao-summary .chip-stat{
      font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;
      background:rgba(255,255,255,.08);color:#c8bfa8;
    }
    .cart-total-row{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:14px;padding-top:12px;border-top:1px solid rgba(240,235,224,.15);
      font-weight:800;font-size:1.05rem;font-family:var(--font-mono);color:#f0d78c;
    }
    .cart-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid rgba(240,235,224,.1)}
    .cart-line:last-of-type{border-bottom:0}
    .cart-line small{display:block;color:#a89f8c;font-size:.8rem;margin-top:3px}
    .cart-line .qty{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(240,235,224,.2);border-radius:999px;padding:4px 8px}
    .cart-line .qty button{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#f0ebe0;font-weight:800;cursor:pointer}
    .cart-empty{text-align:center;padding:28px 12px;color:#a89f8c}
    .option-block{margin-top:18px}
    .option-block h3{margin:0 0 8px;font-size:.95rem;color:#f0ebe0}
    .check{
      display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 8px;
      border:1px solid rgba(240,235,224,.15);border-radius:12px;cursor:pointer;font-weight:600;color:#f0ebe0;
    }
    .check:has(input:checked){border-color:#c45c26;background:rgba(196,92,38,.15)}
    .check input{width:auto;margin:0;accent-color:#c45c26}
    .check span{flex:1}
    .check b{color:#a89f8c;font-size:.88rem;font-family:var(--font-mono)}
    body.modal-open,body.conta-open{overflow:hidden}
    .name-gate{
      position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.72);backdrop-filter:blur(8px);padding:20px;
    }
    .name-gate[hidden]{display:none!important}
    .name-gate__card{
      width:min(100%,360px);background:#1f1f1f;border:1px solid rgba(240,235,224,.2);
      border-radius:18px;padding:22px 18px;color:#f0ebe0;
    }
    .name-gate__card h2{margin:0 0 8px;font-family:Kalam,cursive;font-size:1.35rem}
    .name-gate__card p{margin:0 0 14px;color:#a89f8c;font-size:.92rem}
    .name-gate__card input{
      width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(240,235,224,.25);
      background:rgba(255,255,255,.06);color:#f0ebe0;font-size:1rem;margin-bottom:12px;
    }
    .name-gate__card .btn{width:100%}
    #cart{display:none}
    .toast-ok{
      position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
      background:#16a34a;color:#fff;padding:14px 20px;border-radius:14px;
      font-weight:700;z-index:110;max-width:min(92vw,360px);text-align:center;
    }
    @media(min-width:901px){
      .modal-root{align-items:center;padding:24px}
      .modal-sheet{border-radius:20px;max-height:min(88vh,680px);border-bottom:1px solid rgba(240,235,224,.15)}
    }
    @media (prefers-reduced-motion:reduce){
      .fly-ing,.splash,.sand *{transition:none!important;animation:none!important}
    }
  </style>
  </head>
<body class="board-page">
<main class="board">
  <header class="board-header">
    <h1 class="menu-title">MENU</h1>
    <div class="mesa-line" id="mesaDesk">Cardápio</div>
  </header>
  <div class="board-frame">
    <div id="menu"></div>
  </div>
  <div class="board-tools">
    <button type="button" class="btn primary" id="contaBtn" onclick="toggleConta()">📋 Conta da mesa</button>
  </div>
</main>

<div class="burger-dock">
  <button type="button" class="burger-btn" id="burgerBtn" onclick="togglePedir()" aria-label="Pedir" aria-expanded="false">
    <span class="badge-count" id="cartBadge">0</span>
    <span class="sand" aria-hidden="true">
      <span class="bun-top"></span>
      <span class="lettuce"></span>
      <span class="tomato"></span>
      <span class="cheese"></span>
      <span class="patty"></span>
      <span class="bun-bot"></span>
    </span>
  </button>
  <span class="burger-hint" id="burgerHint">pedir</span>
</div>
<div class="sauce-layer" id="sauceLayer" aria-hidden="true"></div>

<div id="nameGate" class="name-gate" hidden>
  <div class="name-gate__card" role="dialog" aria-modal="true" aria-label="Seu nome">
    <h2>Como podemos te chamar?</h2>
    <p>Só o primeiro nome — a cozinha e o garçom usam para achar sua mesa com mais facilidade.</p>
    <input id="clienteNomeInput" type="text" maxlength="80" placeholder="Ex.: Ana" autocomplete="nickname">
    <button type="button" class="btn primary" id="clienteNomeBtn">Continuar</button>
  </div>
</div>
<div id="cart"></div>
<div id="modal"></div>

<script>
const token = location.pathname.split('/').filter(Boolean).pop() || '';
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

if (!UUID_RE.test(token)) {
  document.body.innerHTML = '<main class="wrap"><div class="panel"><h2>Mesa inválida</h2><p class="muted">Escaneie o QR Code da mesa. O link precisa conter o token UUID.</p></div></main>';
  throw new Error('token inválido');
}

let categorias = [];
let produtos = [];
let cart = [];
let totalDevido = 0;
let orderNoteDraft = '';
let cartOpen = false;
let sessaoData = null;
let sessaoOpen = false;
let clienteNome = '';

function getClienteNome() {
  if (clienteNome) return clienteNome;
  try { clienteNome = sessionStorage.getItem('lq-cliente-nome-' + token) || ''; } catch (_) {}
  return clienteNome;
}
function setClienteNome(nome) {
  clienteNome = String(nome || '').trim().slice(0, 80);
  try { sessionStorage.setItem('lq-cliente-nome-' + token, clienteNome); } catch (_) {}
}
function ensureClienteNome() {
  return new Promise((resolve) => {
    if (getClienteNome()) return resolve(getClienteNome());
    const gate = document.getElementById('nameGate');
    const input = document.getElementById('clienteNomeInput');
    const btn = document.getElementById('clienteNomeBtn');
    if (!gate || !input || !btn) {
      console.error('nameGate elements missing');
      return resolve('');
    }
    gate.hidden = false;
    gate.removeAttribute('hidden');
    setTimeout(() => input.focus(), 50);
    let finished = false;
    const done = () => {
      if (finished) return;
      const n = (input.value || '').trim();
      if (!n) { input.focus(); input.style.outline = '2px solid #c45c26'; return; }
      finished = true;
      setClienteNome(n);
      gate.hidden = true;
      gate.setAttribute('hidden', '');
      fetch('/api/mesas/' + token + '/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clienteNome: n }),
      }).catch(() => {});
      resolve(n);
    };
    btn.addEventListener('click', done);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(); } });
  });
}

const STATUS_LABEL = {
  recebido: 'Recebido',
  em_producao: 'Na cozinha',
  concluido: 'Pronto',
  entregue: 'Entregue',
};

const br = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
}[m]));

function temPersonalizacao(p) {
  return (p.adicionais && p.adicionais.length) || (p.removiveis && p.removiveis.length);
}

function statusLabel(s) {
  return STATUS_LABEL[s] || s || '—';
}

function cartCount() {
  return cart.reduce((s, i) => s + i.qty, 0);
}

function cartTotal() {
  return cart.reduce((s, i) => s + itemTotal(i), 0);
}

function updateCartPill() {
  const n = cartCount();
  const countEl = document.getElementById('cartCount');
  if (countEl) countEl.textContent = n;
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.textContent = n;
    // badge no sanduíche = total da conta / itens do carrinho: mostra pedidos ativos se houver sessão
    const ativos = (sessaoData && sessaoData.pedidos)
      ? sessaoData.pedidos.filter(p => p.status !== 'entregue').length
      : 0;
    const show = n > 0 || ativos > 0;
    badge.textContent = n > 0 ? n : (ativos || '');
    badge.classList.toggle('show', show && (n > 0 || ativos > 0));
  }
  const hint = document.getElementById('burgerHint');
  if (hint) hint.textContent = document.body.classList.contains('pedir-open') || cartOpen ? 'fechar' : 'pedir';
}

function showToast(html, ms = 1800) {
  const toast = document.createElement('div');
  toast.className = 'toast-ok';
  toast.innerHTML = html;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), ms);
}

async function loadSessao() {
  try {
    const r = await fetch('/api/mesas/' + token + '/sessao');
    if (!r.ok) return;
    const s = await r.json();
    sessaoData = s;
    totalDevido = s.totalDevido || 0;
    document.getElementById('mesaDesk').textContent = 'Mesa ' + s.mesa + (getClienteNome() ? ' · ' + getClienteNome() : ' · Cardápio');
    updateCartPill();
    if (sessaoOpen) openSessao();
  } catch (_) {}
}

function openSessao() {
  sessaoOpen = true;
  cartOpen = false;
  document.body.classList.add('conta-open');
  const s = sessaoData || { pedidos: [], totalDevido: 0, mesa: '—' };
  const pedidos = s.pedidos || [];

  const counts = { recebido: 0, em_producao: 0, concluido: 0, entregue: 0 };
  pedidos.forEach(p => { if (counts[p.status] != null) counts[p.status]++; });

  const summary = [
    counts.recebido && `<span class="chip-stat">${counts.recebido} recebido(s)</span>`,
    counts.em_producao && `<span class="chip-stat">${counts.em_producao} na cozinha</span>`,
    counts.concluido && `<span class="chip-stat">${counts.concluido} pronto(s)</span>`,
    counts.entregue && `<span class="chip-stat">${counts.entregue} entregue(s)</span>`,
  ].filter(Boolean).join('') || '<span class="chip-stat">Nenhum pedido nesta visita</span>';

  const blocks = pedidos.length
    ? pedidos.slice().reverse().map(p => {
        const hora = p.criado_em
          ? new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
          : '';
        const itens = (p.itens || []).map(it => {
          const adds = (it.adicionais || []).map(a => a.nome || a).filter(Boolean);
          const rems = it.remocoes || [];
          return `<div class="pedido-item">
            <div>
              <b>${it.quantidade}× ${esc(it.nome)}</b>
              ${adds.length ? `<small>+ ${adds.map(esc).join(', ')}</small>` : ''}
              ${rems.length ? `<small>Sem: ${rems.map(esc).join(', ')}</small>` : ''}
              ${it.ponto_carne ? `<small>🥩 ${esc(it.ponto_carne)}</small>` : ''}
              ${it.observacao ? `<small>📝 ${esc(it.observacao)}</small>` : ''}
            </div>
            <b style="font-family:var(--font-mono);white-space:nowrap">${br(it.totalLinha != null ? it.totalLinha : (Number(it.preco_unitario) || 0) * (it.quantidade || 1))}</b>
          </div>`;
        }).join('');
        return `<div class="pedido-block">
          <div class="pedido-head">
            <div>
              <b>Pedido #${p.id}</b>
              ${hora ? `<small class="muted" style="display:block;margin-top:2px">${hora}</small>` : ''}
            </div>
            <span class="status-pill ${esc(p.status)}">${statusLabel(p.status)}</span>
          </div>
          ${itens}
          <div class="pedido-item" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
            <span class="muted">Subtotal</span>
            <b style="font-family:var(--font-mono)">${br(p.totalPedido || 0)}</b>
          </div>
          ${p.observacao_geral ? `<small class="muted" style="display:block;margin-top:6px">Obs.: ${esc(p.observacao_geral)}</small>` : ''}
        </div>`;
      }).join('')
    : '<div class="sessao-empty">Você ainda não enviou nenhum pedido.<br>Escolha itens no cardápio e toque em 🛒.</div>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true" aria-label="Conta da mesa">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>Conta da mesa ${esc(String(s.mesa ?? ''))}</h2>
        ${getClienteNome() ? `<p class="muted" style="margin:0 0 8px">Olá, <b>${esc(getClienteNome())}</b></p>` : ''}
        <p class="muted" style="margin:0 0 4px">Acompanhe o que já pediu e o status de cada pedido</p>
        <div class="cart-total-row" style="margin-top:8px;margin-bottom:12px">
          <span>Total da mesa</span>
          <span>${br(s.totalDevido || 0)}</span>
        </div>
        <div class="sessao-summary">${summary}</div>
        ${blocks}
        <p class="muted" style="font-size:.78rem;margin:16px 0 0;text-align:center">
          Status atualiza em tempo real quando a cozinha/garçom avançam o pedido
        </p>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function togglePedir() {
  if (cartOpen) { closeModal(); return; }
  spawnBurgerExplosion();
  document.body.classList.add('pedir-open');
  openCart();
  const btn = document.getElementById('burgerBtn');
  if (btn) { btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-label', 'Fechar pedido'); }
  updateCartPill();
}

function toggleConta() {
  if (sessaoOpen) { closeModal(); return; }
  openSessao();
  updateCartPill();
}

async function loadCardapio() {
  const r = await fetch('/api/cardapio');
  if (!r.ok) {
    document.getElementById('menu').innerHTML = '<div class="panel">Não foi possível carregar o cardápio.</div>';
    return;
  }
  categorias = await r.json();
  produtos = categorias.flatMap(c => c.produtos.map(p => ({ ...p, categoriaNome: c.nome })));
  renderMenu();
}

function renderMenu() {
  document.getElementById('menu').innerHTML = categorias.map((c, i) => `
    <div class="chalk-cat${i === 0 ? ' open' : ''}" data-cat="${c.id}">
      <button type="button" class="chalk-cat__head" onclick="toggleCat(this)">
        <span>${esc(c.nome)}</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="chalk-cat__body">
        ${c.produtos.map(p => {
          const custom = temPersonalizacao(p);
          return `
          <article class="chalk-item">
            <h3>${esc(p.nome)}</h3>
            <p class="desc">${esc(p.descricao || '')}</p>
            <div class="row">
              <span class="price">${br(p.preco)}</span>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                ${custom ? `<button class="btn ghost" type="button" onclick="openProduct(${p.id})">Personalizar</button>` : ''}
                <button class="btn primary" type="button" onclick="quickAdd(${p.id})">Adicionar</button>
              </div>
            </div>
          </article>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function toggleCat(btn) {
  const cat = btn.closest('.chalk-cat');
  const wasOpen = cat.classList.contains('open');
  // opcional: um aberto por vez
  document.querySelectorAll('.chalk-cat.open').forEach(el => el.classList.remove('open'));
  if (!wasOpen) cat.classList.add('open');
}

function spawnBurgerExplosion() {
  const layer = document.getElementById('sauceLayer');
  layer.innerHTML = '';
  const btn = document.getElementById('burgerBtn');
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const types = ['tomato', 'lettuce', 'cheese', 'patty', 'bun', 'tomato', 'lettuce', 'cheese', 'patty'];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Pedacinhos do lanche — voam e FICAM como marcas
  types.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'fly-ing ' + t;
    el.style.left = (cx - 20) + 'px';
    el.style.top = (cy - 8) + 'px';
    layer.appendChild(el);
    const angle = (Math.PI * 2 * i) / types.length + (Math.random() * 0.5 - 0.25);
    const dist = 100 + Math.random() * 160;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 30;
    const rot = (Math.random() * 140 - 70);
    requestAnimationFrame(() => {
      el.style.opacity = '0.9';
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
      setTimeout(() => el.classList.add('settled'), reduce ? 0 : 520);
    });
  });

  // Espirros de molho — pousam e permanecem
  const splashCount = reduce ? 6 : 18;
  for (let i = 0; i < splashCount; i++) {
    const s = document.createElement('div');
    const kind = i % 3 === 0 ? 'mustard' : (i % 3 === 1 ? 'mayo' : 'ketchup');
    s.className = 'splash ' + kind;
    const size = 14 + Math.random() * 36;
    s.style.width = size + 'px';
    s.style.height = size * (0.65 + Math.random() * 0.55) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const d = 50 + Math.random() * 220;
    s.style.left = (cx + Math.cos(ang) * d - size / 2) + 'px';
    s.style.top = (cy + Math.sin(ang) * d * 0.85 - size / 2 - 40) + 'px';
    s.style.animationDelay = (Math.random() * 0.2) + 's';
    layer.appendChild(s);
    setTimeout(() => s.classList.add('settled'), reduce ? 0 : 600 + Math.random() * 200);
  }
}

function quickAdd(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: [],
    removals: [],
    note: '',
  });
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function openProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = p.adicionais || [];
  const rem = p.removiveis || [];
  const notePh = p.pedePontoCarne
    ? 'Ex.: ao ponto, bem passado, pouco molho…'
    : 'Ex.: pouco molho, sem picles…';

  cartOpen = false;
  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>${esc(p.nome)}</h2>
        <p class="muted">${esc(p.descricao || '')}</p>
        <p class="price" style="margin:8px 0 0">${br(p.preco)}</p>
        ${adds.length ? `
          <div class="option-block">
            <h3>Adicionar ao lanche</h3>
            ${adds.map(a => `
              <label class="check">
                <input type="checkbox" data-add="${a.id}" onchange="updateModalTotal(${p.id})">
                <span>${esc(a.nome)}</span>
                <b>+ ${br(a.preco)}</b>
              </label>`).join('')}
          </div>` : ''}
        ${rem.length ? `
          <div class="option-block">
            <h3>Remover ingredientes</h3>
            <p class="muted small">Marque o que você não quer.</p>
            ${rem.map(x => `
              <label class="check">
                <input type="checkbox" data-rem="${esc(x)}">
                <span>Sem ${esc(x)}</span>
              </label>`).join('')}
          </div>` : ''}
        <div class="option-block">
          <h3>Observação do lanche</h3>
          <p class="muted small">Inclua ponto da carne, preferências etc.</p>
          <textarea id="itemNote" class="input textarea" maxlength="300"
            placeholder="${esc(notePh)}"></textarea>
        </div>
        <button class="btn primary full" type="button" id="modalAddBtn" onclick="confirmProduct(${p.id})">
          Adicionar ao carrinho · ${br(p.preco)}
        </button>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function updateModalTotal(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean);
  const total = p.preco + adds.reduce((s, a) => s + Number(a.preco), 0);
  const btn = document.getElementById('modalAddBtn');
  if (btn) btn.textContent = 'Adicionar ao carrinho · ' + br(total);
}

function closeModal() {
  const noteEl = document.getElementById('orderNote');
  if (noteEl) orderNoteDraft = noteEl.value;
  document.getElementById('modal').innerHTML = '';
  document.body.classList.remove('modal-open');
  document.body.classList.remove('conta-open');
  document.body.classList.remove('pedir-open');
  cartOpen = false;
  sessaoOpen = false;
  const btn = document.getElementById('burgerBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  updateCartPill();
  setTimeout(() => {
    const layer = document.getElementById('sauceLayer');
    if (layer) layer.innerHTML = '';
  }, 280);
}

function confirmProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean)
    .map(a => ({ id: a.id, nome: a.nome, preco: a.preco }));
  const rem = [...document.querySelectorAll('[data-rem]:checked')].map(e => e.dataset.rem);
  const note = document.getElementById('itemNote')?.value.trim() || '';

  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: adds,
    removals: rem,
    note,
  });
  closeModal();
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function itemTotal(i) {
  const p = produtos.find(x => x.id === i.productId);
  if (!p) return 0;
  return (p.preco + i.additions.reduce((s, a) => s + a.preco, 0)) * i.qty;
}

function openCart() {
  cartOpen = true;
  const total = cartTotal();
  const lines = cart.length
    ? cart.map(i => {
        const p = produtos.find(x => x.id === i.productId);
        return `<div class="cart-line">
          <div>
            <b>${i.qty}× ${esc(p?.nome || 'Item')}</b>
            ${i.additions.length ? `<small>+ ${i.additions.map(a => esc(a.nome)).join(', ')}</small>` : ''}
            ${i.removals.length ? `<small>sem ${i.removals.map(esc).join(', ')}</small>` : ''}
            ${i.note ? `<small>📝 ${esc(i.note)}</small>` : ''}
            <small>${br(itemTotal(i))}</small>
          </div>
          <div class="qty">
            <button type="button" onclick="changeQty('${i.key}',-1)">−</button>
            <b>${i.qty}</b>
            <button type="button" onclick="changeQty('${i.key}',1)">+</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="cart-empty">Carrinho vazio. Adicione itens do cardápio.</div>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true" aria-label="Carrinho">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>Seu pedido</h2>
        <p class="muted" style="margin:0 0 8px">Revise e envie para a cozinha</p>
        ${lines}
        ${cart.length ? `
          <div class="cart-total-row"><span>Total</span><span>${br(total)}</span></div>
          <textarea class="input textarea" id="orderNote" maxlength="500"
            placeholder="Observação geral do pedido (opcional)">${esc(orderNoteDraft)}</textarea>
          <button class="btn primary full" type="button" id="btnSend" onclick="send()">
            Enviar pedido · ${br(total)}
          </button>
        ` : ''}
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function changeQty(key, d) {
  const i = cart.find(x => x.key === key);
  if (!i) return;
  i.qty += d;
  if (i.qty <= 0) cart = cart.filter(x => x.key !== key);
  updateCartPill();
  if (cartOpen) openCart();
}

async function send() {
  await ensureClienteNome();
  if (!cart.length) return;
  const btn = document.getElementById('btnSend');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }

  const orderNote = document.getElementById('orderNote')?.value || '';
  orderNoteDraft = orderNote;
  const items = cart.map(i => ({
    productId: i.productId,
    qty: i.qty,
    additions: i.additions.map(a => ({ id: a.id })),
    removals: i.removals,
    note: i.note,
  }));

  try {
    const r = await fetch('/api/mesas/' + token + '/pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
      clienteNome: getClienteNome(), items, note: orderNote }),
    });
    const o = await r.json();
    if (!r.ok) {
      alert(o.error || 'Não foi possível enviar');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar pedido'; }
      return;
    }

    cart = [];
    orderNoteDraft = '';
    updateCartPill();
    closeModal();
    await loadSessao();
    showToast(`Pedido #${o.id} enviado · ${br(o.total)}<br><small>O total da mesa foi atualizado</small>`, 3200);
  } catch (e) {
    alert('Falha de rede ao enviar o pedido');
    if (btn) { btn.disabled = false; if (cartOpen) openCart(); }
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('mesaDesk').textContent = 'Cardápio';
ensureClienteNome().then(() => {
  loadSessao();
  loadCardapio();
});

function connectEvents() {
  if (typeof EventSource === 'undefined') {
    setInterval(loadSessao, 8000);
    return;
  }
  const es = new EventSource('/api/events');
  es.addEventListener('update', () => loadSessao());
  es.addEventListener('hello', () => loadSessao());
  setInterval(loadSessao, 30000);
}
connectEvents();

</script>
</body>
</html>
