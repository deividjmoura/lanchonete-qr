<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Cardápio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .sessao-bar{
      position:sticky;top:0;z-index:20;
      background:var(--sessao-bg);color:var(--sessao-text);
      padding:10px 14px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      font-size:.92rem;
      transition:background-color .2s ease,color .2s ease;
    }
    .sessao-bar strong{font-size:1.05rem;font-family:var(--font-mono)}
    .sessao-bar .muted-light{opacity:.75;font-size:.8rem}
    .mobile-header{top:auto}
    body.has-sessao .mobile-header{top:42px}
    body.has-sessao #categories,body.has-sessao .categories{top:108px}
    .toast-ok{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      background:var(--success);color:#fff;padding:14px 20px;border-radius:14px;
      font-weight:700;z-index:110;box-shadow:var(--shadow-lg);
      max-width:min(92vw,360px);text-align:center;
    }
    .product-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .product-actions .btn{min-height:40px;padding:0 14px;font-size:.88rem}

    /* Overlay compartilhado (personalizar + carrinho) */
    .modal-root{
      position:fixed;inset:0;z-index:80;
      display:flex;align-items:flex-end;justify-content:center;
    }
    .modal-backdrop{
      position:absolute;inset:0;
      background:var(--modal-backdrop);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }
    .modal-sheet{
      position:relative;z-index:1;
      width:min(100%,480px);
      max-height:min(92vh,720px);
      overflow:auto;
      background:var(--modal-bg);
      border-radius:20px 20px 0 0;
      box-shadow:var(--shadow-lg);
      padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
      animation:sheetUp .22s ease;
      border:1px solid var(--line);
      border-bottom:0;
      transition:background-color .2s ease;
    }
    @keyframes sheetUp{
      from{transform:translateY(24px);opacity:.6}
      to{transform:translateY(0);opacity:1}
    }
    .modal-sheet .close{
      position:absolute;top:12px;right:12px;
      width:40px;height:40px;border-radius:50%;
      border:1px solid var(--line);background:var(--surface);
      font-size:1.4rem;line-height:1;font-weight:700;color:var(--muted);
      transition:background-color .2s ease,border-color .2s ease;
    }
    .modal-sheet .close:hover{background:var(--surface-2)}
    .modal-sheet h2{margin:0 40px 6px 0;font-size:1.25rem}
    .option-block{margin-top:18px}
    .option-block h3{margin:0 0 8px;font-size:.95rem}
    .option-block .small{font-size:.82rem;margin:0 0 10px}
    .check{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;margin:0 0 8px;
      border:1px solid var(--line);border-radius:12px;
      cursor:pointer;font-weight:600;
      transition:border-color .2s ease,background-color .2s ease;
    }
    .check:has(input:checked){border-color:var(--check-active-border);background:var(--check-active-bg)}
    .check input{width:auto;margin:0;accent-color:var(--primary)}
    .check span{flex:1}
    .check b{color:var(--muted);font-size:.88rem;font-family:var(--font-mono)}
    body.modal-open{overflow:hidden}

    /* Carrinho só no modal — não ocupa a página */
    #cart{display:none}
    .cart-line{
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      padding:12px 0;border-bottom:1px solid var(--line);
    }
    .cart-line:last-of-type{border-bottom:0}
    .cart-line small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
    .cart-line .qty{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--line);border-radius:999px;padding:4px 8px;
      flex-shrink:0;
    }
    .cart-line .qty button{
      width:28px;height:28px;border:0;border-radius:50%;
      background:var(--qty-btn-bg);color:var(--text);font-weight:800;cursor:pointer;
      transition:background-color .2s ease;
    }
    .cart-total-row{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
      font-weight:800;font-size:1.05rem;font-family:var(--font-mono);
    }
    .cart-empty{text-align:center;padding:28px 12px;color:var(--muted)}

    @media(min-width:901px){
      .sessao-bar{border-radius:0 0 14px 14px;margin:0 auto;width:min(100% - 32px,920px)}
      body.has-sessao .mobile-header{top:0}
      .modal-root{align-items:center;padding:24px}
      .modal-sheet{border-radius:20px;max-height:min(88vh,680px);border-bottom:1px solid var(--line)}
    }
  </style>
  <script>
  (function(){try{var t=localStorage.getItem('lq-theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  function toggleTheme(){var h=document.documentElement,c=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',c);try{localStorage.setItem('lq-theme',c)}catch(e){}}
  </script>
</head>
<body>
<div class="sessao-bar" id="sessaoBar" hidden>
  <div>
    <div class="muted-light">Total da mesa até agora</div>
    <strong id="sessaoTotal">R$ 0,00</strong>
  </div>
  <div class="muted-light" id="sessaoInfo">—</div>
</div>

<header class="mobile-header">
  <div>
    <strong>🍔 Lanchonete QR</strong>
    <small id="mesa"></small>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema" title="Tema claro/escuro">🌓</button>
    <button type="button" class="cart-pill" id="cartPill" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="wrap client">
  <div class="desktop-top">
    <div>
      <div class="brand">🍔 Lanchonete QR</div>
      <div class="muted" id="mesaDesk"></div>
    </div>
  </div>
  <div id="categories" class="categories"></div>
  <div id="menu"></div>
</main>

<div id="cart"></div>
<div id="modal"></div>

<script>
const token = location.pathname.split('/').filter(Boolean).pop() || '';
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

if (!UUID_RE.test(token)) {
  document.body.innerHTML = '<main class="wrap"><div class="panel"><h2>Mesa inválida</h2><p class="muted">Escaneie o QR Code da mesa. O link precisa conter o token UUID.</p></div></main>';
  throw new Error('token inválido');
}

let categorias = [];
let produtos = [];
let cart = [];
let totalDevido = 0;
let orderNoteDraft = '';
let cartOpen = false;

const br = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
}[m]));

function temPersonalizacao(p) {
  return (p.adicionais && p.adicionais.length) || (p.removiveis && p.removiveis.length);
}

function cartCount() {
  return cart.reduce((s, i) => s + i.qty, 0);
}

function cartTotal() {
  return cart.reduce((s, i) => s + itemTotal(i), 0);
}

function updateCartPill() {
  const n = cartCount();
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartPill').classList.toggle('has-items', n > 0);
}

function showToast(html, ms = 1800) {
  const toast = document.createElement('div');
  toast.className = 'toast-ok';
  toast.innerHTML = html;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), ms);
}

async function loadSessao() {
  try {
    const r = await fetch('/api/mesas/' + token + '/sessao');
    if (!r.ok) return;
    const s = await r.json();
    totalDevido = s.totalDevido || 0;
    document.getElementById('mesa').textContent = 'Mesa ' + s.mesa;
    document.getElementById('mesaDesk').textContent = 'Mesa ' + s.mesa + ' · Cardápio';
    document.getElementById('sessaoTotal').textContent = br(totalDevido);
    document.getElementById('sessaoInfo').textContent = s.sessaoAberta
      ? (s.pedidos?.length || 0) + ' pedido(s)'
      : 'Nenhum pedido ainda';
    document.getElementById('sessaoBar').hidden = false;
    document.body.classList.add('has-sessao');
  } catch (_) {}
}

async function loadCardapio() {
  const r = await fetch('/api/cardapio');
  if (!r.ok) {
    document.getElementById('menu').innerHTML = '<div class="panel">Não foi possível carregar o cardápio.</div>';
    return;
  }
  categorias = await r.json();
  produtos = categorias.flatMap(c => c.produtos.map(p => ({ ...p, categoriaNome: c.nome })));
  renderMenu();
}

function renderMenu() {
  document.getElementById('categories').innerHTML = categorias.map((c, i) =>
    `<a class="${i ? '' : 'active'}" href="#cat-${c.id}">${esc(c.nome)}</a>`
  ).join('');

  document.getElementById('menu').innerHTML = categorias.map(c => `
    <section id="cat-${c.id}">
      <h2 class="cat">${esc(c.nome)}</h2>
      <div class="grid">
        ${c.produtos.map(p => {
          const custom = temPersonalizacao(p);
          return `
          <article class="card product-card">
            <div>
              <h3>${esc(p.nome)}</h3>
              <p class="muted">${esc(p.descricao || '')}</p>
            </div>
            <div class="row" style="align-items:flex-end">
              <span class="price">${br(p.preco)}</span>
              <div class="product-actions">
                ${custom ? `<button class="btn ghost" type="button" onclick="openProduct(${p.id})">Personalizar</button>` : ''}
                <button class="btn primary" type="button" onclick="quickAdd(${p.id})">Adicionar</button>
              </div>
            </div>
          </article>`;
        }).join('')}
      </div>
    </section>
  `).join('');
}

function quickAdd(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: [],
    removals: [],
    note: '',
  });
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function openProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = p.adicionais || [];
  const rem = p.removiveis || [];
  const notePh = p.pedePontoCarne
    ? 'Ex.: ao ponto, bem passado, pouco molho…'
    : 'Ex.: pouco molho, sem picles…';

  cartOpen = false;
  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>${esc(p.nome)}</h2>
        <p class="muted">${esc(p.descricao || '')}</p>
        <p class="price" style="margin:8px 0 0">${br(p.preco)}</p>
        ${adds.length ? `
          <div class="option-block">
            <h3>Adicionar ao lanche</h3>
            ${adds.map(a => `
              <label class="check">
                <input type="checkbox" data-add="${a.id}" onchange="updateModalTotal(${p.id})">
                <span>${esc(a.nome)}</span>
                <b>+ ${br(a.preco)}</b>
              </label>`).join('')}
          </div>` : ''}
        ${rem.length ? `
          <div class="option-block">
            <h3>Remover ingredientes</h3>
            <p class="muted small">Marque o que você não quer.</p>
            ${rem.map(x => `
              <label class="check">
                <input type="checkbox" data-rem="${esc(x)}">
                <span>Sem ${esc(x)}</span>
              </label>`).join('')}
          </div>` : ''}
        <div class="option-block">
          <h3>Observação do lanche</h3>
          <p class="muted small">Inclua ponto da carne, preferências etc.</p>
          <textarea id="itemNote" class="input textarea" maxlength="300"
            placeholder="${esc(notePh)}"></textarea>
        </div>
        <button class="btn primary full" type="button" id="modalAddBtn" onclick="confirmProduct(${p.id})">
          Adicionar ao carrinho · ${br(p.preco)}
        </button>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function updateModalTotal(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean);
  const total = p.preco + adds.reduce((s, a) => s + Number(a.preco), 0);
  const btn = document.getElementById('modalAddBtn');
  if (btn) btn.textContent = 'Adicionar ao carrinho · ' + br(total);
}

function closeModal() {
  const noteEl = document.getElementById('orderNote');
  if (noteEl) orderNoteDraft = noteEl.value;
  document.getElementById('modal').innerHTML = '';
  document.body.classList.remove('modal-open');
  cartOpen = false;
}

function confirmProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean)
    .map(a => ({ id: a.id, nome: a.nome, preco: a.preco }));
  const rem = [...document.querySelectorAll('[data-rem]:checked')].map(e => e.dataset.rem);
  const note = document.getElementById('itemNote')?.value.trim() || '';

  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: adds,
    removals: rem,
    note,
  });
  closeModal();
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function itemTotal(i) {
  const p = produtos.find(x => x.id === i.productId);
  if (!p) return 0;
  return (p.preco + i.additions.reduce((s, a) => s + a.preco, 0)) * i.qty;
}

function openCart() {
  cartOpen = true;
  const total = cartTotal();
  const lines = cart.length
    ? cart.map(i => {
        const p = produtos.find(x => x.id === i.productId);
        return `<div class="cart-line">
          <div>
            <b>${i.qty}× ${esc(p?.nome || 'Item')}</b>
            ${i.additions.length ? `<small>+ ${i.additions.map(a => esc(a.nome)).join(', ')}</small>` : ''}
            ${i.removals.length ? `<small>sem ${i.removals.map(esc).join(', ')}</small>` : ''}
            ${i.note ? `<small>📝 ${esc(i.note)}</small>` : ''}
            <small>${br(itemTotal(i))}</small>
          </div>
          <div class="qty">
            <button type="button" onclick="changeQty('${i.key}',-1)">−</button>
            <b>${i.qty}</b>
            <button type="button" onclick="changeQty('${i.key}',1)">+</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="cart-empty">Carrinho vazio. Adicione itens do cardápio.</div>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true" aria-label="Carrinho">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>Seu pedido</h2>
        <p class="muted" style="margin:0 0 8px">Revise e envie para a cozinha</p>
        ${lines}
        ${cart.length ? `
          <div class="cart-total-row"><span>Total</span><span>${br(total)}</span></div>
          <textarea class="input textarea" id="orderNote" maxlength="500"
            placeholder="Observação geral do pedido (opcional)">${esc(orderNoteDraft)}</textarea>
          <button class="btn primary full" type="button" id="btnSend" onclick="send()">
            Enviar pedido · ${br(total)}
          </button>
        ` : ''}
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function changeQty(key, d) {
  const i = cart.find(x => x.key === key);
  if (!i) return;
  i.qty += d;
  if (i.qty <= 0) cart = cart.filter(x => x.key !== key);
  updateCartPill();
  if (cartOpen) openCart();
}

async function send() {
  if (!cart.length) return;
  const btn = document.getElementById('btnSend');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }

  const orderNote = document.getElementById('orderNote')?.value || '';
  orderNoteDraft = orderNote;
  const items = cart.map(i => ({
    productId: i.productId,
    qty: i.qty,
    additions: i.additions.map(a => ({ id: a.id })),
    removals: i.removals,
    note: i.note,
  }));

  try {
    const r = await fetch('/api/mesas/' + token + '/pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, note: orderNote }),
    });
    const o = await r.json();
    if (!r.ok) {
      alert(o.error || 'Não foi possível enviar');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar pedido'; }
      return;
    }

    cart = [];
    orderNoteDraft = '';
    updateCartPill();
    closeModal();
    await loadSessao();
    showToast(`Pedido #${o.id} enviado · ${br(o.total)}<br><small>O total da mesa foi atualizado</small>`, 3200);
  } catch (e) {
    alert('Falha de rede ao enviar o pedido');
    if (btn) { btn.disabled = false; if (cartOpen) openCart(); }
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('mesa').textContent = 'Carregando…';
document.getElementById('mesaDesk').textContent = 'Cardápio';
loadSessao();
loadCardapio();
setInterval(loadSessao, 8000);
</script>
</body>
</html>
