<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Cardápio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .sessao-bar{
      position:sticky;top:0;z-index:20;
      background:var(--sessao-bg);color:var(--sessao-text);
      padding:10px 14px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      font-size:.92rem;
      transition:background-color .2s ease,color .2s ease,box-shadow .2s ease;
      cursor:pointer;border:0;width:100%;text-align:left;
      font:inherit;color:inherit;
    }
    .sessao-bar:hover,.sessao-bar:focus-visible{
      box-shadow:0 4px 20px rgba(0,0,0,.25);
      outline:none;
    }
    .sessao-bar strong{font-size:1.1rem;font-family:var(--font-mono);letter-spacing:-.02em}
    .sessao-bar .muted-light{opacity:.78;font-size:.78rem}
    .sessao-bar .sessao-cta{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 12px;border-radius:999px;
      background:rgba(255,255,255,.12);font-size:.78rem;font-weight:700;
      white-space:nowrap;
    }
    /* Sem header sticky duplicado — título só no corpo */
    .mobile-header{display:none!important}
    #categories,.categories{display:none!important}
    .desktop-top{margin-bottom:8px}
    .desktop-top .brand{margin-bottom:2px}

    /* Offset: só barra da sessão */
    #menu section[id^="cat-"],
    .cat-section{
      scroll-margin-top:24px;
    }
    body.has-sessao #menu section[id^="cat-"],
    body.has-sessao .cat-section{
      scroll-margin-top:72px;
    }
    /* Espaço pro sanduíche flutuante embaixo */
    main.wrap.client{padding-bottom:120px}

    /* ===== Sanduíche SEMPRE fixo na base da viewport ===== */
    .burger-dock{
      --bun:#e4a667;
      --bun-dark:#d1985e;
      --tomato:#e53935;
      --lettuce:#8bc34a;
      --cheese:#ffc107;
      --patty:#4e342e;
      position:fixed !important;
      left:0;right:0;
      bottom:0;
      padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
      z-index:50;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      pointer-events:none;
      /* sem transform no dock — evita bug de containing block */
      transform:none !important;
    }
    .burger-dock .burger-btn,
    .burger-dock .burger-hint{pointer-events:auto}
    .burger-btn{
      position:relative;
      width:56px;height:48px;
      border:0;border-radius:8px;
      background:transparent;
      box-shadow:none;
      cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      padding:0;
      transition:transform .15s ease,filter .15s ease;
      filter:drop-shadow(0 4px 10px rgba(15,23,42,.28));
    }
    .burger-btn:active{transform:scale(.96)}
    .burger-btn:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
    .burger-btn .badge-count{
      position:absolute;top:-4px;right:-4px;
      min-width:22px;height:22px;padding:0 6px;
      border-radius:999px;background:var(--primary);color:#fff;
      font-size:.72rem;font-weight:800;
      display:none;align-items:center;justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    .burger-btn .badge-count.show{display:inline-flex}
    .burger-stack{
      width:40px;height:34px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;
      pointer-events:none;
      transition:gap .35s ease;
    }
    .burger-stack .bun-top{
      width:38px;height:11px;border-radius:16px 16px 4px 4px;
      background:linear-gradient(180deg,var(--bun) 0%,var(--bun-dark) 100%);
      position:relative;box-shadow:inset 0 -1px 0 rgba(0,0,0,.1);
      transition:transform .4s cubic-bezier(.2,.9,.2,1);
    }
    .burger-stack .bun-top::before,
    .burger-stack .bun-top::after{
      content:"";position:absolute;width:4px;height:3px;background:rgba(255,255,255,.5);
      border-radius:50%;top:3px;
    }
    .burger-stack .bun-top::before{left:9px;transform:rotate(25deg)}
    .burger-stack .bun-top::after{right:10px;transform:rotate(-20deg)}
    .burger-stack .ing{border-radius:3px;transition:transform .45s cubic-bezier(.15,.85,.25,1),opacity .3s}
    .burger-stack .ing.tomato{width:32px;height:5px;background:var(--tomato)}
    .burger-stack .ing.lettuce{width:40px;height:4px;background:var(--lettuce);border-radius:4px}
    .burger-stack .ing.cheese{width:36px;height:3px;background:var(--cheese)}
    .burger-stack .ing.patty{width:34px;height:7px;background:var(--patty);border-radius:5px}
    .burger-stack .bun-bot{
      width:38px;height:8px;border-radius:4px 4px 12px 12px;
      background:linear-gradient(180deg,var(--bun) 0%,var(--bun-dark) 100%);
      transition:transform .4s cubic-bezier(.2,.9,.2,1);
    }
    body.menu-open .burger-dock{z-index:96}
    body.menu-open .burger-btn{background:transparent;box-shadow:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
    body.menu-open .burger-stack{gap:10px}
    body.menu-open .burger-stack .bun-top{transform:translateY(-6px)}
    body.menu-open .burger-stack .bun-bot{transform:translateY(6px)}
    body.menu-open .burger-stack .ing{opacity:0;transform:scale(.5)}

    .burger-hint{
      font-size:.68rem;font-weight:700;color:var(--muted);
      letter-spacing:.04em;text-transform:uppercase;
      text-shadow:0 1px 2px rgba(0,0,0,.15);
    }
    body.menu-open .burger-hint{color:#fff;opacity:.9}

    /* Cards do cardápio — mobile-first */
    .client .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .client .product-card{
      display:flex;flex-direction:column;gap:12px;
    }
    .client .product-card .row{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    }
    .client .product-actions{
      display:flex;flex-wrap:wrap;gap:8px;
      flex:1 1 auto;justify-content:flex-end;min-width:0;
    }
    .client .product-actions .btn{
      min-height:40px;padding:0 12px;font-size:.85rem;
      white-space:nowrap;
    }
    @media(min-width:560px){
      .client .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(min-width:900px){
      .client .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    /* Overlay do menu */
    .cat-menu{
      position:fixed;inset:0;z-index:90;
      pointer-events:none;opacity:0;
      transition:opacity .28s ease;
    }
    body.menu-open .cat-menu{pointer-events:auto;opacity:1}
    .cat-menu__backdrop{
      position:absolute;inset:0;
      background:rgba(10,14,22,.72);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .cat-menu__panel{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 20px 120px;gap:10px;
      transform:translateY(12px);opacity:0;
      transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .3s ease;
      z-index:1;
    }
    body.menu-open .cat-menu__panel{transform:translateY(0);opacity:1}
    .cat-menu__title{
      font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      color:rgba(255,255,255,.65);margin-bottom:4px;
    }
    .cat-menu__list{
      list-style:none;margin:0;padding:0;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      width:min(100%,300px);
    }
    .cat-menu__list a{
      display:block;width:100%;text-align:center;
      padding:14px 18px;border-radius:14px;
      background:rgba(255,255,255,.1);color:#fff;
      font-weight:700;font-size:1.12rem;letter-spacing:-.02em;
      border:1px solid rgba(255,255,255,.14);
      transition:background .2s ease,transform .2s ease,border-color .2s ease;
    }
    .cat-menu__list a:hover,
    .cat-menu__list a:focus-visible{
      background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);
      transform:scale(1.03);outline:none;
    }
    .cat-menu__list a.active{background:var(--primary);border-color:var(--primary)}
    .cat-menu__actions{
      display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
      width:min(100%,300px);margin-top:14px;
    }
    .cat-menu__actions .btn{
      flex:1;min-width:120px;
      background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff;
    }
    .cat-menu__actions .btn:hover{background:rgba(255,255,255,.22)}
    .cat-menu__actions .btn.primary{
      background:var(--primary);border-color:var(--primary);color:#fff;
    }
    /* Fechar = só o sanduíche + toque no fundo (sem botão extra) */

    /* Camada de marcas (permanecem enquanto menu aberto) */
    .sauce-layer{
      position:fixed;inset:0;z-index:91;pointer-events:none;overflow:hidden;
    }
    .fly-ing{
      position:absolute;border-radius:4px;
      transition:transform .55s cubic-bezier(.15,.85,.25,1),opacity .4s ease;
      opacity:0;will-change:transform;
    }
    .fly-ing.tomato{width:48px;height:10px;background:#e53935;border-radius:3px}
    .fly-ing.lettuce{width:56px;height:8px;background:#8bc34a;border-radius:6px}
    .fly-ing.cheese{width:50px;height:6px;background:#ffc107;border-radius:2px}
    .fly-ing.patty{width:46px;height:14px;background:#4e342e;border-radius:6px}
    .fly-ing.bun{width:52px;height:16px;background:#e4a667;border-radius:12px 12px 4px 4px}
    .fly-ing.settled{opacity:.55!important}
    .splash{
      position:absolute;border-radius:50% 40% 55% 45%;
      opacity:0;pointer-events:none;
      animation:splashLand .55s ease-out forwards;
    }
    .splash.ketchup{background:#c62828}
    .splash.mustard{background:#f9a825}
    .splash.mayo{background:#fff8e1}
    .splash.settled{
      animation:none;
      opacity:.35;
      filter:blur(.3px);
    }
    @keyframes splashLand{
      0%{transform:scale(.15) rotate(0deg);opacity:0}
      40%{opacity:.85}
      100%{transform:scale(1) rotate(28deg);opacity:.4}
    }
    @media (prefers-reduced-motion:reduce){
      .fly-ing,.splash,.cat-menu__panel,.burger-stack *{transition:none!important;animation:none!important}
    }
    .status-pill{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:700;
      letter-spacing:.03em;text-transform:uppercase;
    }
    .status-pill.recebido{background:var(--primary-soft);color:var(--primary)}
    .status-pill.em_producao{background:var(--warning-soft);color:var(--warning)}
    .status-pill.concluido{background:var(--success-soft);color:var(--success)}
    .status-pill.entregue{background:var(--chip-bg);color:var(--muted)}
    .pedido-block{
      border:1px solid var(--line);border-radius:14px;padding:14px;
      margin-bottom:12px;background:var(--surface-2);
    }
    .pedido-block:last-child{margin-bottom:0}
    .pedido-head{
      display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;
      margin-bottom:8px;
    }
    .pedido-head b{font-size:.95rem}
    .pedido-item{
      display:flex;justify-content:space-between;gap:10px;
      padding:6px 0;border-top:1px solid var(--line);font-size:.9rem;
    }
    .pedido-item:first-of-type{border-top:0;padding-top:0}
    .pedido-item small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
    .sessao-empty{text-align:center;padding:28px 12px;color:var(--muted)}
    .sessao-summary{
      display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;
    }
    .sessao-summary .chip-stat{
      font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;
      background:var(--chip-bg);color:var(--muted);
    }
    .toast-ok{
      position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
      background:var(--success);color:#fff;padding:14px 20px;border-radius:14px;
      font-weight:700;z-index:110;box-shadow:var(--shadow-lg);
      max-width:min(92vw,360px);text-align:center;
    }
    .product-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .product-actions .btn{min-height:40px;padding:0 14px;font-size:.88rem}

    /* Overlay compartilhado (personalizar + carrinho) */
    .modal-root{
      position:fixed;inset:0;z-index:100;
      display:flex;align-items:flex-end;justify-content:center;
    }
    .modal-backdrop{
      position:absolute;inset:0;
      background:var(--modal-backdrop);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }
    .modal-sheet{
      position:relative;z-index:1;
      width:min(100%,480px);
      max-height:min(92vh,720px);
      overflow:auto;
      background:var(--modal-bg);
      border-radius:20px 20px 0 0;
      box-shadow:var(--shadow-lg);
      padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
      animation:sheetUp .22s ease;
      border:1px solid var(--line);
      border-bottom:0;
      transition:background-color .2s ease;
    }
    @keyframes sheetUp{
      from{transform:translateY(24px);opacity:.6}
      to{transform:translateY(0);opacity:1}
    }
    .modal-sheet .close{
      position:absolute;top:12px;right:12px;
      width:40px;height:40px;border-radius:50%;
      border:1px solid var(--line);background:var(--surface);
      font-size:1.4rem;line-height:1;font-weight:700;color:var(--muted);
      transition:background-color .2s ease,border-color .2s ease;
    }
    .modal-sheet .close:hover{background:var(--surface-2)}
    .modal-sheet h2{margin:0 40px 6px 0;font-size:1.25rem}
    .option-block{margin-top:18px}
    .option-block h3{margin:0 0 8px;font-size:.95rem}
    .option-block .small{font-size:.82rem;margin:0 0 10px}
    .check{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;margin:0 0 8px;
      border:1px solid var(--line);border-radius:12px;
      cursor:pointer;font-weight:600;
      transition:border-color .2s ease,background-color .2s ease;
    }
    .check:has(input:checked){border-color:var(--check-active-border);background:var(--check-active-bg)}
    .check input{width:auto;margin:0;accent-color:var(--primary)}
    .check span{flex:1}
    .check b{color:var(--muted);font-size:.88rem;font-family:var(--font-mono)}
    body.modal-open{overflow:hidden}

    /* Carrinho só no modal — não ocupa a página */
    #cart{display:none}
    .cart-line{
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      padding:12px 0;border-bottom:1px solid var(--line);
    }
    .cart-line:last-of-type{border-bottom:0}
    .cart-line small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
    .cart-line .qty{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--line);border-radius:999px;padding:4px 8px;
      flex-shrink:0;
    }
    .cart-line .qty button{
      width:28px;height:28px;border:0;border-radius:50%;
      background:var(--qty-btn-bg);color:var(--text);font-weight:800;cursor:pointer;
      transition:background-color .2s ease;
    }
    .cart-total-row{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
      font-weight:800;font-size:1.05rem;font-family:var(--font-mono);
    }
    .cart-empty{text-align:center;padding:28px 12px;color:var(--muted)}

    @media(min-width:901px){
      .sessao-bar{border-radius:0 0 14px 14px;margin:0 auto;width:min(100% - 32px,920px)}
      #menu section[id^="cat-"],.cat-section{scroll-margin-top:24px}
      body.has-sessao #menu section[id^="cat-"],
      body.has-sessao .cat-section{scroll-margin-top:72px}
      .modal-root{align-items:center;padding:24px}
      .modal-sheet{border-radius:20px;max-height:min(88vh,680px);border-bottom:1px solid var(--line)}
    }
  </style>
  <script>
  (function(){try{var t=localStorage.getItem('lq-theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  function toggleTheme(){var h=document.documentElement,c=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',c);try{localStorage.setItem('lq-theme',c)}catch(e){}}
  </script>
</head>
<body>
<button type="button" class="sessao-bar" id="sessaoBar" hidden onclick="openSessao()" aria-label="Ver conta da mesa">
  <div>
    <div class="muted-light">Conta da mesa · toque para detalhes</div>
    <strong id="sessaoTotal">R$ 0,00</strong>
  </div>
  <div class="sessao-cta">
    <span id="sessaoInfo">—</span>
    <span aria-hidden="true">›</span>
  </div>
</button>

<main class="wrap client">
  <div class="desktop-top">
    <div>
      <div class="brand">🍔 Lanchonete QR</div>
      <div class="muted" id="mesaDesk">Cardápio</div>
    </div>
  </div>
  <div id="categories" class="categories" hidden></div>
  <div id="menu"></div>
</main>

<!-- Sanduíche flutuante (base da tela) -->
<div class="burger-dock">
  <button type="button" class="burger-btn" id="burgerBtn" onclick="toggleCatMenu()" aria-label="Abrir menu" aria-expanded="false" aria-controls="catMenu">
    <span class="badge-count" id="cartBadge">0</span>
    <span class="burger-stack" aria-hidden="true">
      <span class="bun-top"></span>
      <span class="ing tomato"></span>
      <span class="ing lettuce"></span>
      <span class="ing cheese"></span>
      <span class="ing patty"></span>
      <span class="bun-bot"></span>
    </span>
  </button>
  <span class="burger-hint" id="burgerHint">menu</span>
</div>

<!-- Overlay: categorias + carrinho + tema -->
<nav class="cat-menu" id="catMenu" hidden aria-label="Menu do cardápio">
  <div class="cat-menu__backdrop" onclick="closeCatMenu()"></div>
  <div class="sauce-layer" id="sauceLayer" aria-hidden="true"></div>
  <div class="cat-menu__panel">
    <div class="cat-menu__title">Categorias</div>
    <ul class="cat-menu__list" id="catMenuList"></ul>
    <div class="cat-menu__actions">
      <button type="button" class="btn primary" id="menuCartBtn" onclick="closeCatMenu();openCart()">
        🛒 Carrinho <span id="cartCount">0</span>
      </button>
      <button type="button" class="btn" onclick="toggleTheme()" aria-label="Alternar tema">
        🌓 Tema
      </button>
    </div>
  </div>
</nav>

<div id="cart"></div>
<div id="modal"></div>

<script>
const token = location.pathname.split('/').filter(Boolean).pop() || '';
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

if (!UUID_RE.test(token)) {
  document.body.innerHTML = '<main class="wrap"><div class="panel"><h2>Mesa inválida</h2><p class="muted">Escaneie o QR Code da mesa. O link precisa conter o token UUID.</p></div></main>';
  throw new Error('token inválido');
}

let categorias = [];
let produtos = [];
let cart = [];
let totalDevido = 0;
let orderNoteDraft = '';
let cartOpen = false;
let sessaoData = null;
let sessaoOpen = false;

const STATUS_LABEL = {
  recebido: 'Recebido',
  em_producao: 'Na cozinha',
  concluido: 'Pronto',
  entregue: 'Entregue',
};

const br = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
}[m]));

function temPersonalizacao(p) {
  return (p.adicionais && p.adicionais.length) || (p.removiveis && p.removiveis.length);
}

function statusLabel(s) {
  return STATUS_LABEL[s] || s || '—';
}

function cartCount() {
  return cart.reduce((s, i) => s + i.qty, 0);
}

function cartTotal() {
  return cart.reduce((s, i) => s + itemTotal(i), 0);
}

function updateCartPill() {
  const n = cartCount();
  const countEl = document.getElementById('cartCount');
  if (countEl) countEl.textContent = n;
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.textContent = n;
    badge.classList.toggle('show', n > 0);
  }
  const hint = document.getElementById('burgerHint');
  if (hint) hint.textContent = document.body.classList.contains('menu-open') ? 'fechar' : 'menu';
}

function showToast(html, ms = 1800) {
  const toast = document.createElement('div');
  toast.className = 'toast-ok';
  toast.innerHTML = html;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), ms);
}

async function loadSessao() {
  try {
    const r = await fetch('/api/mesas/' + token + '/sessao');
    if (!r.ok) return;
    const s = await r.json();
    sessaoData = s;
    totalDevido = s.totalDevido || 0;
    document.getElementById('mesaDesk').textContent = 'Mesa ' + s.mesa + ' · Cardápio';
    document.getElementById('sessaoTotal').textContent = br(totalDevido);

    const pedidos = s.pedidos || [];
    const ativos = pedidos.filter(p => p.status !== 'entregue').length;
    let info = 'Nenhum pedido ainda';
    if (pedidos.length) {
      info = pedidos.length + ' pedido(s)';
      if (ativos) info += ' · ' + ativos + ' em andamento';
    }
    document.getElementById('sessaoInfo').textContent = info;
    document.getElementById('sessaoBar').hidden = false;
    document.body.classList.add('has-sessao');

    // Se o modal da conta estiver aberto, atualiza o conteúdo com status novo
    if (sessaoOpen) openSessao();
  } catch (_) {}
}

function openSessao() {
  sessaoOpen = true;
  cartOpen = false;
  const s = sessaoData || { pedidos: [], totalDevido: 0, mesa: '—' };
  const pedidos = s.pedidos || [];

  const counts = { recebido: 0, em_producao: 0, concluido: 0, entregue: 0 };
  pedidos.forEach(p => { if (counts[p.status] != null) counts[p.status]++; });

  const summary = [
    counts.recebido && `<span class="chip-stat">${counts.recebido} recebido(s)</span>`,
    counts.em_producao && `<span class="chip-stat">${counts.em_producao} na cozinha</span>`,
    counts.concluido && `<span class="chip-stat">${counts.concluido} pronto(s)</span>`,
    counts.entregue && `<span class="chip-stat">${counts.entregue} entregue(s)</span>`,
  ].filter(Boolean).join('') || '<span class="chip-stat">Nenhum pedido nesta visita</span>';

  const blocks = pedidos.length
    ? pedidos.slice().reverse().map(p => {
        const hora = p.criado_em
          ? new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
          : '';
        const itens = (p.itens || []).map(it => {
          const adds = (it.adicionais || []).map(a => a.nome || a).filter(Boolean);
          const rems = it.remocoes || [];
          return `<div class="pedido-item">
            <div>
              <b>${it.quantidade}× ${esc(it.nome)}</b>
              ${adds.length ? `<small>+ ${adds.map(esc).join(', ')}</small>` : ''}
              ${rems.length ? `<small>Sem: ${rems.map(esc).join(', ')}</small>` : ''}
              ${it.ponto_carne ? `<small>🥩 ${esc(it.ponto_carne)}</small>` : ''}
              ${it.observacao ? `<small>📝 ${esc(it.observacao)}</small>` : ''}
            </div>
            <b style="font-family:var(--font-mono);white-space:nowrap">${br(it.totalLinha != null ? it.totalLinha : (Number(it.preco_unitario) || 0) * (it.quantidade || 1))}</b>
          </div>`;
        }).join('');
        return `<div class="pedido-block">
          <div class="pedido-head">
            <div>
              <b>Pedido #${p.id}</b>
              ${hora ? `<small class="muted" style="display:block;margin-top:2px">${hora}</small>` : ''}
            </div>
            <span class="status-pill ${esc(p.status)}">${statusLabel(p.status)}</span>
          </div>
          ${itens}
          <div class="pedido-item" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
            <span class="muted">Subtotal</span>
            <b style="font-family:var(--font-mono)">${br(p.totalPedido || 0)}</b>
          </div>
          ${p.observacao_geral ? `<small class="muted" style="display:block;margin-top:6px">Obs.: ${esc(p.observacao_geral)}</small>` : ''}
        </div>`;
      }).join('')
    : '<div class="sessao-empty">Você ainda não enviou nenhum pedido.<br>Escolha itens no cardápio e toque em 🛒.</div>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true" aria-label="Conta da mesa">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>Conta da mesa ${esc(String(s.mesa ?? ''))}</h2>
        <p class="muted" style="margin:0 0 4px">Acompanhe o que já pediu e o status de cada pedido</p>
        <div class="cart-total-row" style="margin-top:8px;margin-bottom:12px">
          <span>Total da mesa</span>
          <span>${br(s.totalDevido || 0)}</span>
        </div>
        <div class="sessao-summary">${summary}</div>
        ${blocks}
        <p class="muted" style="font-size:.78rem;margin:16px 0 0;text-align:center">
          Status atualiza automaticamente a cada poucos segundos
        </p>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

async function loadCardapio() {
  const r = await fetch('/api/cardapio');
  if (!r.ok) {
    document.getElementById('menu').innerHTML = '<div class="panel">Não foi possível carregar o cardápio.</div>';
    return;
  }
  categorias = await r.json();
  produtos = categorias.flatMap(c => c.produtos.map(p => ({ ...p, categoriaNome: c.nome })));
  renderMenu();
}

function renderMenu() {
  document.getElementById('catMenuList').innerHTML = categorias.map((c, i) =>
    `<li><a href="#cat-${c.id}" data-cat="${c.id}" class="${i ? '' : 'active'}">${esc(c.nome)}</a></li>`
  ).join('');

  document.getElementById('menu').innerHTML = categorias.map(c => `
    <section id="cat-${c.id}" class="cat-section">
      <h2 class="cat">${esc(c.nome)}</h2>
      <div class="grid">
        ${c.produtos.map(p => {
          const custom = temPersonalizacao(p);
          return `
          <article class="card product-card">
            <div>
              <h3>${esc(p.nome)}</h3>
              <p class="muted">${esc(p.descricao || '')}</p>
            </div>
            <div class="row" style="align-items:flex-end">
              <span class="price">${br(p.preco)}</span>
              <div class="product-actions">
                ${custom ? `<button class="btn ghost" type="button" onclick="openProduct(${p.id})">Personalizar</button>` : ''}
                <button class="btn primary" type="button" onclick="quickAdd(${p.id})">Adicionar</button>
              </div>
            </div>
          </article>`;
        }).join('')}
      </div>
    </section>
  `).join('');

  document.querySelectorAll('a[data-cat]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const id = a.getAttribute('data-cat');
      closeCatMenu();
      // espera o overlay fechar para medir o header real
      setTimeout(() => goToCategory(id), 50);
    });
  });
}

function stickyOffset() {
  const sessao = document.getElementById('sessaoBar');
  let h = 16;
  if (sessao && !sessao.hidden) h += sessao.getBoundingClientRect().height;
  return Math.ceil(h);
}

function goToCategory(id) {
  const el = document.getElementById('cat-' + id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - stickyOffset();
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  document.querySelectorAll('a[data-cat]').forEach(a => {
    a.classList.toggle('active', a.getAttribute('data-cat') === String(id));
  });
}

function toggleCatMenu() {
  if (document.body.classList.contains('menu-open')) closeCatMenu();
  else openCatMenu();
}

function openCatMenu() {
  const menu = document.getElementById('catMenu');
  const btn = document.getElementById('burgerBtn');
  menu.hidden = false;
  void menu.offsetWidth;
  document.body.classList.add('menu-open');
  document.body.classList.add('modal-open');
  btn.setAttribute('aria-expanded', 'true');
  btn.setAttribute('aria-label', 'Fechar menu');
  updateCartPill();
  spawnBurgerExplosion();
}

function closeCatMenu() {
  document.body.classList.remove('menu-open');
  if (!document.getElementById('modal').innerHTML) {
    document.body.classList.remove('modal-open');
  }
  const btn = document.getElementById('burgerBtn');
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-label', 'Abrir menu');
  updateCartPill();
  setTimeout(() => {
    if (!document.body.classList.contains('menu-open')) {
      document.getElementById('catMenu').hidden = true;
      document.getElementById('sauceLayer').innerHTML = '';
    }
  }, 320);
}

function spawnBurgerExplosion() {
  const layer = document.getElementById('sauceLayer');
  layer.innerHTML = '';
  const btn = document.getElementById('burgerBtn');
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const types = ['tomato', 'lettuce', 'cheese', 'patty', 'bun', 'tomato', 'lettuce', 'cheese', 'patty'];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Pedacinhos do lanche — voam e FICAM como marcas
  types.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'fly-ing ' + t;
    el.style.left = (cx - 20) + 'px';
    el.style.top = (cy - 8) + 'px';
    layer.appendChild(el);
    const angle = (Math.PI * 2 * i) / types.length + (Math.random() * 0.5 - 0.25);
    const dist = 100 + Math.random() * 160;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 30;
    const rot = (Math.random() * 140 - 70);
    requestAnimationFrame(() => {
      el.style.opacity = '0.9';
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
      setTimeout(() => el.classList.add('settled'), reduce ? 0 : 520);
    });
  });

  // Espirros de molho — pousam e permanecem
  const splashCount = reduce ? 6 : 18;
  for (let i = 0; i < splashCount; i++) {
    const s = document.createElement('div');
    const kind = i % 3 === 0 ? 'mustard' : (i % 3 === 1 ? 'mayo' : 'ketchup');
    s.className = 'splash ' + kind;
    const size = 14 + Math.random() * 36;
    s.style.width = size + 'px';
    s.style.height = size * (0.65 + Math.random() * 0.55) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const d = 50 + Math.random() * 220;
    s.style.left = (cx + Math.cos(ang) * d - size / 2) + 'px';
    s.style.top = (cy + Math.sin(ang) * d * 0.85 - size / 2 - 40) + 'px';
    s.style.animationDelay = (Math.random() * 0.2) + 's';
    layer.appendChild(s);
    setTimeout(() => s.classList.add('settled'), reduce ? 0 : 600 + Math.random() * 200);
  }
}

function quickAdd(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: [],
    removals: [],
    note: '',
  });
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function openProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = p.adicionais || [];
  const rem = p.removiveis || [];
  const notePh = p.pedePontoCarne
    ? 'Ex.: ao ponto, bem passado, pouco molho…'
    : 'Ex.: pouco molho, sem picles…';

  cartOpen = false;
  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>${esc(p.nome)}</h2>
        <p class="muted">${esc(p.descricao || '')}</p>
        <p class="price" style="margin:8px 0 0">${br(p.preco)}</p>
        ${adds.length ? `
          <div class="option-block">
            <h3>Adicionar ao lanche</h3>
            ${adds.map(a => `
              <label class="check">
                <input type="checkbox" data-add="${a.id}" onchange="updateModalTotal(${p.id})">
                <span>${esc(a.nome)}</span>
                <b>+ ${br(a.preco)}</b>
              </label>`).join('')}
          </div>` : ''}
        ${rem.length ? `
          <div class="option-block">
            <h3>Remover ingredientes</h3>
            <p class="muted small">Marque o que você não quer.</p>
            ${rem.map(x => `
              <label class="check">
                <input type="checkbox" data-rem="${esc(x)}">
                <span>Sem ${esc(x)}</span>
              </label>`).join('')}
          </div>` : ''}
        <div class="option-block">
          <h3>Observação do lanche</h3>
          <p class="muted small">Inclua ponto da carne, preferências etc.</p>
          <textarea id="itemNote" class="input textarea" maxlength="300"
            placeholder="${esc(notePh)}"></textarea>
        </div>
        <button class="btn primary full" type="button" id="modalAddBtn" onclick="confirmProduct(${p.id})">
          Adicionar ao carrinho · ${br(p.preco)}
        </button>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function updateModalTotal(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean);
  const total = p.preco + adds.reduce((s, a) => s + Number(a.preco), 0);
  const btn = document.getElementById('modalAddBtn');
  if (btn) btn.textContent = 'Adicionar ao carrinho · ' + br(total);
}

function closeModal() {
  const noteEl = document.getElementById('orderNote');
  if (noteEl) orderNoteDraft = noteEl.value;
  document.getElementById('modal').innerHTML = '';
  document.body.classList.remove('modal-open');
  cartOpen = false;
  sessaoOpen = false;
}

function confirmProduct(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  const adds = [...document.querySelectorAll('[data-add]:checked')]
    .map(e => (p.adicionais || []).find(a => String(a.id) === e.dataset.add))
    .filter(Boolean)
    .map(a => ({ id: a.id, nome: a.nome, preco: a.preco }));
  const rem = [...document.querySelectorAll('[data-rem]:checked')].map(e => e.dataset.rem);
  const note = document.getElementById('itemNote')?.value.trim() || '';

  cart.push({
    key: crypto.randomUUID(),
    productId: id,
    qty: 1,
    additions: adds,
    removals: rem,
    note,
  });
  closeModal();
  updateCartPill();
  showToast(`${esc(p.nome)} adicionado`);
}

function itemTotal(i) {
  const p = produtos.find(x => x.id === i.productId);
  if (!p) return 0;
  return (p.preco + i.additions.reduce((s, a) => s + a.preco, 0)) * i.qty;
}

function openCart() {
  cartOpen = true;
  const total = cartTotal();
  const lines = cart.length
    ? cart.map(i => {
        const p = produtos.find(x => x.id === i.productId);
        return `<div class="cart-line">
          <div>
            <b>${i.qty}× ${esc(p?.nome || 'Item')}</b>
            ${i.additions.length ? `<small>+ ${i.additions.map(a => esc(a.nome)).join(', ')}</small>` : ''}
            ${i.removals.length ? `<small>sem ${i.removals.map(esc).join(', ')}</small>` : ''}
            ${i.note ? `<small>📝 ${esc(i.note)}</small>` : ''}
            <small>${br(itemTotal(i))}</small>
          </div>
          <div class="qty">
            <button type="button" onclick="changeQty('${i.key}',-1)">−</button>
            <b>${i.qty}</b>
            <button type="button" onclick="changeQty('${i.key}',1)">+</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="cart-empty">Carrinho vazio. Adicione itens do cardápio.</div>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-root" role="dialog" aria-modal="true" aria-label="Carrinho">
      <div class="modal-backdrop" onclick="closeModal()"></div>
      <div class="modal-sheet">
        <button class="close" type="button" onclick="closeModal()" aria-label="Fechar">×</button>
        <h2>Seu pedido</h2>
        <p class="muted" style="margin:0 0 8px">Revise e envie para a cozinha</p>
        ${lines}
        ${cart.length ? `
          <div class="cart-total-row"><span>Total</span><span>${br(total)}</span></div>
          <textarea class="input textarea" id="orderNote" maxlength="500"
            placeholder="Observação geral do pedido (opcional)">${esc(orderNoteDraft)}</textarea>
          <button class="btn primary full" type="button" id="btnSend" onclick="send()">
            Enviar pedido · ${br(total)}
          </button>
        ` : ''}
      </div>
    </div>`;
  document.body.classList.add('modal-open');
}

function changeQty(key, d) {
  const i = cart.find(x => x.key === key);
  if (!i) return;
  i.qty += d;
  if (i.qty <= 0) cart = cart.filter(x => x.key !== key);
  updateCartPill();
  if (cartOpen) openCart();
}

async function send() {
  if (!cart.length) return;
  const btn = document.getElementById('btnSend');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }

  const orderNote = document.getElementById('orderNote')?.value || '';
  orderNoteDraft = orderNote;
  const items = cart.map(i => ({
    productId: i.productId,
    qty: i.qty,
    additions: i.additions.map(a => ({ id: a.id })),
    removals: i.removals,
    note: i.note,
  }));

  try {
    const r = await fetch('/api/mesas/' + token + '/pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, note: orderNote }),
    });
    const o = await r.json();
    if (!r.ok) {
      alert(o.error || 'Não foi possível enviar');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar pedido'; }
      return;
    }

    cart = [];
    orderNoteDraft = '';
    updateCartPill();
    closeModal();
    await loadSessao();
    showToast(`Pedido #${o.id} enviado · ${br(o.total)}<br><small>O total da mesa foi atualizado</small>`, 3200);
  } catch (e) {
    alert('Falha de rede ao enviar o pedido');
    if (btn) { btn.disabled = false; if (cartOpen) openCart(); }
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.body.classList.contains('menu-open')) closeCatMenu();
    else closeModal();
  }
});

document.getElementById('mesaDesk').textContent = 'Cardápio';
loadSessao();
loadCardapio();
function connectEvents() {
  if (typeof EventSource === 'undefined') {
    setInterval(loadSessao, 8000);
    return;
  }
  const es = new EventSource('/api/events');
  es.addEventListener('update', () => loadSessao());
  es.addEventListener('hello', () => loadSessao());
  setInterval(loadSessao, 30000);
}
connectEvents();
</script>
</body>
</html>
