<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Garçom · Lanchonete QR</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .badge.concluido{background:#e8f5e9;color:#1b5e20}
    .item-extra{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
    .item-extra .sem{color:#c62828}
    .item-extra .com{color:#16834a}
    .item-extra .ponto{color:#6d4c41;font-weight:700}
    .empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty-state .big{font-size:2.4rem;margin-bottom:8px}
    .meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .age{font-size:.8rem;color:var(--muted)}
    .age.warn{color:#e65100;font-weight:700}
    .age.hot{color:#c62828;font-weight:800}
    .toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      background:#111;color:#fff;padding:12px 18px;border-radius:12px;
      font-weight:600;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;
      max-width:min(92vw,360px);text-align:center;
    }
    .toast.show{opacity:1}
    .toast.err{background:#b71c1c}
    .toast.ok{background:#1b5e20}
    .mesa-hint{font-size:.9rem;color:var(--muted);margin-top:4px}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <div class="brand">🛎️ Garçom</div>
      <div class="muted">Pedidos <code>concluido</code> → marcar <code>entregue</code> (valor entra na conta da mesa)</div>
    </div>
    <div class="nav">
      <a class="btn" href="/cozinha">Cozinha</a>
      <a class="btn" href="/admin">Admin</a>
      <a class="btn dark" href="/">Início</a>
    </div>
  </div>

  <div id="stats" class="muted" style="margin-bottom:14px"></div>
  <div id="orders" class="kgrid"></div>
</main>
<div id="toast" class="toast"></div>

<script>
const PONTO = {
  MAL_PASSADO: 'Mal passado',
  AO_PONTO: 'Ao ponto',
  BEM_PASSADO: 'Bem passado',
};

function fmtHora(iso) {
  try {
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch {
    return '—';
  }
}

function idadeMinutos(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / 60000));
}

function ageClass(min) {
  if (min >= 10) return 'hot';
  if (min >= 5) return 'warn';
  return '';
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function extrasHtml(item) {
  const parts = [];
  if (item.ponto_carne && PONTO[item.ponto_carne]) {
    parts.push(`<span class="ponto">Ponto: ${PONTO[item.ponto_carne]}</span>`);
  }
  const adds = Array.isArray(item.adicionais) ? item.adicionais : [];
  if (adds.length) {
    parts.push(`<span class="com">+ ${adds.map((a) => a.nome).join(', ')}</span>`);
  }
  const rems = Array.isArray(item.remocoes) ? item.remocoes : [];
  if (rems.length) {
    parts.push(`<span class="sem">sem ${rems.join(', ')}</span>`);
  }
  if (item.observacao) {
    parts.push(`Obs.: ${esc(item.observacao)}`);
  }
  return parts.length ? `<small class="item-extra">${parts.join(' · ')}</small>` : '';
}

function card(p) {
  const min = idadeMinutos(p.criado_em);
  const itens = (p.itens || [])
    .map(
      (i) =>
        `<div class="row">
          <span><b>${i.quantidade}×</b> ${esc(i.nome)}${extrasHtml(i)}</span>
        </div>`
    )
    .join('');

  return `<article class="order" data-id="${p.id}">
    <div class="row">
      <div>
        <div class="big">Mesa ${p.mesa}</div>
        <div class="meta-row">
          <span class="badge concluido">Pronto</span>
          <span class="age ${ageClass(min)}">${min === 0 ? 'agora' : min + ' min na fila'}</span>
        </div>
        <div class="mesa-hint">Levar à mesa e confirmar entrega</div>
      </div>
      <b>#${p.id}</b>
    </div>
    <hr>
    ${itens || '<p class="muted">Sem itens</p>'}
    ${p.observacao_geral ? `<p><b>Obs. geral:</b> ${esc(p.observacao_geral)}</p>` : ''}
    <p class="muted">Pedido às ${fmtHora(p.criado_em)}</p>
    <div class="nav">
      <button class="btn primary" data-deliver="${p.id}">Marcar entregue</button>
    </div>
  </article>`;
}

function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    el.className = 'toast';
  }, 2200);
}

let loading = false;
let advancing = false;

async function load() {
  if (loading || advancing) return;
  loading = true;
  try {
    const res = await fetch('/api/garcom/pedidos');
    if (!res.ok) throw new Error('Falha ao carregar fila');
    const pedidos = await res.json();

    document.getElementById('stats').textContent = pedidos.length
      ? `${pedidos.length} pedido(s) pronto(s) para entregar`
      : 'Nada aguardando entrega';

    const root = document.getElementById('orders');
    if (!pedidos.length) {
      root.innerHTML =
        '<div class="panel empty-state"><div class="big">✅</div><div>Nenhum pedido pronto no momento.</div></div>';
    } else {
      root.innerHTML = pedidos.map(card).join('');
    }
  } catch (e) {
    console.error(e);
    document.getElementById('stats').textContent = 'Erro ao atualizar a fila';
  } finally {
    loading = false;
  }
}

async function entregar(id) {
  if (advancing) return;
  advancing = true;
  try {
    const res = await fetch(`/api/pedidos/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'entregue' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      toast(data.error || 'Não foi possível marcar como entregue', 'err');
      return;
    }
    toast('Entregue — valor somado na conta da mesa', 'ok');
    await load();
  } catch (e) {
    console.error(e);
    toast('Erro de rede', 'err');
  } finally {
    advancing = false;
  }
}

document.getElementById('orders').addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-deliver]');
  if (!btn) return;
  entregar(Number(btn.dataset.deliver));
});

load();
setInterval(load, 2000);
</script>
</body>
</html>
