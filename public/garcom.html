<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Garçom · Lanchonete QR</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <div class="brand">🛎️ Garçom</div>
      <div class="muted" id="who">Carregando…</div>
    </div>
  </div>
  <div id="stats" class="muted" style="margin-bottom:14px"></div>
  <div id="orders" class="kgrid"></div>
</main>
<div id="toast" class="toast"></div>
<script src="/js/safe-dom.js"></script>
<script>
const parts = location.pathname.split('/').filter(Boolean);
const garcomToken = parts[0] === 'garcom' && parts[1] ? parts[1] : new URLSearchParams(location.search).get('token');
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
if (!garcomToken || !UUID_RE.test(garcomToken)) {
  document.body.innerHTML = '<main class="wrap"><div class="panel"><h2>Acesso do garçom</h2><p class="muted">Use o link pessoal gerado no painel Admin (com seu nome).</p></div></main>';
  throw new Error('token ausente');
}
let me = null, loading = false, advancing = false;
function fmtHora(iso){try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{return'—'}}
function idadeMinutos(iso){return Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000))}
function ageClass(min){if(min>=10)return'hot';if(min>=5)return'warn';return''}
const esc = (s) => {
  if (window.SafeDOM && typeof SafeDOM.escapeHtml === 'function') {
    return SafeDOM.escapeHtml(s);
  }
  return String(s ?? '').replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
  }[m]));
};
function extrasHtml(item){
  const parts=[];
  const adds=Array.isArray(item.adicionais)?item.adicionais:[];
  if(adds.length)parts.push(`<span class="com">+ ${adds.map(a=>a.nome).join(', ')}</span>`);
  const rems=Array.isArray(item.remocoes)?item.remocoes:[];
  if(rems.length)parts.push(`<span class="sem">sem ${rems.join(', ')}</span>`);
  if(item.observacao)parts.push(`Obs.: ${esc(item.observacao)}`);
  return parts.length?`<small class="item-extra">${parts.join(' · ')}</small>`:'';
}
function card(p){
  const min=idadeMinutos(p.criado_em);
  const itens=(p.itens||[]).map(i=>`<div class="row"><span><b>${i.quantidade}×</b> ${esc(i.nome)}${extrasHtml(i)}</span></div>`).join('');
  const cliente=p.cliente_nome?`<div class="muted" style="margin-top:4px">Cliente: <b>${esc(p.cliente_nome)}</b></div>`:'';
  return `<article class="card kcard ${ageClass(min)}">
    <div class="row" style="justify-content:space-between">
      <div><b>Mesa ${esc(String(p.mesa))}</b> · #${p.id}
        <div class="muted">${fmtHora(p.criado_em)} · ${min} min</div>${cliente}</div>
      <span class="badge">Pronto</span>
    </div>
    <div style="margin-top:10px">${itens||'<span class="muted">Sem itens</span>'}</div>
    ${p.observacao_geral?`<p class="muted" style="margin:8px 0 0">Obs.: ${esc(p.observacao_geral)}</p>`:''}
    <div class="nav" style="margin-top:12px">
      <button class="btn primary" type="button" data-deliver="${p.id}">Entregar · assinar como ${esc(me?.nome||'…')}</button>
    </div>
  </article>`;
}
function toast(msg,kind){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(kind||'');clearTimeout(toast._t);toast._t=setTimeout(()=>{el.className='toast'},2400)}
async function loadMe(){
  const res=await fetch('/api/garcom/'+garcomToken+'/me');
  if(!res.ok){document.body.innerHTML='<main class="wrap"><div class="panel"><h2>Link inválido</h2><p class="muted">Peça um novo link ao admin.</p></div></main>';throw new Error('unauth')}
  me=await res.json();
  document.getElementById('who').textContent=me.nome+' · só pedidos prontos para entregar';
}
async function load(){
  if(loading||advancing)return;loading=true;
  try{
    const res=await fetch('/api/garcom/'+garcomToken+'/pedidos');
    if(!res.ok)throw new Error('fail');
    const pedidos=await res.json();
    document.getElementById('stats').textContent=pedidos.length?`${pedidos.length} pronto(s) para entregar`:'Nenhum pedido aguardando entrega';
    document.getElementById('orders').innerHTML=pedidos.length?pedidos.map(card).join(''):'<div class="panel empty-state"><div class="big">✅</div><div>Fila vazia.</div></div>';
  }catch(e){document.getElementById('stats').textContent='Erro ao atualizar'}
  finally{loading=false}
}
async function entregar(id){
  if(advancing)return;advancing=true;
  try{
    const res=await fetch(`/api/garcom/${garcomToken}/pedidos/${id}/entregar`,{method:'POST'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){toast(data.error||'Não foi possível entregar','err');await load();return}
    toast('Entregue e assinado por '+(data.garcom?.nome||me.nome),'ok');
    await load();
  }catch(e){toast('Erro de rede','err')}
  finally{advancing=false}
}
document.getElementById('orders').addEventListener('click',(ev)=>{
  const btn=ev.target.closest('[data-deliver]');if(!btn)return;entregar(Number(btn.dataset.deliver));
});
(async()=>{
  await loadMe();await load();
  if(typeof EventSource!=='undefined'){
    const es=new EventSource('/api/events');
    es.addEventListener('update',()=>load());
    es.addEventListener('hello',()=>load());
    setInterval(load,20000);
  }else setInterval(load,3000);
})();
</script>
</body>
</html>
