<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Cozinha · Lanchonete QR</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/style-ops.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <div class="brand">👨‍🍳 Cozinha</div>
      <div class="muted">Fila <code>recebido</code> → <code>em_producao</code> → <code>concluido</code> · ao vivo (SSE)</div>
    </div>
    <div class="nav">
      <a class="btn" href="/admin">Admin</a>
      <a class="btn dark" href="/">Início</a>
    </div>
  </div>

  <div id="stats" class="muted" style="margin-bottom:14px" aria-live="polite" role="status"></div>
  <div id="orders" class="kgrid"></div>
</main>
<div id="toast" class="toast"></div>

<script src="/js/safe-dom.js"></script>
<script src="/js/realtime.js"></script>

<script>
const LABELS = {
  recebido: 'Novo',
  em_producao: 'Preparando',
  concluido: 'Concluído',
  entregue: 'Entregue',
};

const PONTO = {
  MAL_PASSADO: 'Mal passado',
  AO_PONTO: 'Ao ponto',
  BEM_PASSADO: 'Bem passado',
};

const PROXIMO = {
  recebido: 'em_producao',
  em_producao: 'concluido',
};

const ACAO = {
  recebido: 'Começar preparo',
  em_producao: 'Marcar concluído',
};

function fmtHora(iso) {
  try {
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch {
    return '—';
  }
}

function idadeMinutos(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / 60000));
}

function ageClass(min) {
  if (min >= 15) return 'hot';
  if (min >= 8) return 'warn';
  return '';
}

function extrasHtml(item) {
  const parts = [];
  if (item.ponto_carne && PONTO[item.ponto_carne]) {
    parts.push(`<span class="ponto">Ponto: ${PONTO[item.ponto_carne]}</span>`);
  }
  const adds = Array.isArray(item.adicionais) ? item.adicionais : [];
  if (adds.length) {
    parts.push(`<span class="com">+ ${adds.map((a) => a.nome).join(', ')}</span>`);
  }
  const rems = Array.isArray(item.remocoes) ? item.remocoes : [];
  if (rems.length) {
    parts.push(`<span class="sem">sem ${rems.join(', ')}</span>`);
  }
  if (item.observacao) {
    parts.push(`Obs.: ${esc(item.observacao)}`);
  }
  return parts.length ? `<small class="item-extra">${parts.join(' · ')}</small>` : '';
}

const esc = (s) => {
  if (window.SafeDOM && typeof SafeDOM.escapeHtml === 'function') {
    return SafeDOM.escapeHtml(s);
  }
  return String(s ?? '').replace(/[&<>"']/g, (m) => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#039;',
  }[m]));
};

function card(p) {
  const min = idadeMinutos(p.criado_em);
  const proximo = PROXIMO[p.status];
  const acao = ACAO[p.status];
  const itens = (p.itens || [])
    .map(
      (i) =>
        `<div class="row">
          <span><b>${i.quantidade}×</b> ${esc(i.nome)}${extrasHtml(i)}</span>
        </div>`
    )
    .join('');

  return `<article class="order ${p.status === 'recebido' ? 'new' : ''}" data-id="${p.id}">
    <div class="row">
      <div>
        <div class="big">Mesa ${p.mesa}</div>
        ${p.cliente_nome ? `<div class="muted">Cliente: <b>${esc(p.cliente_nome)}</b></div>` : ''}
        <div class="meta-row">
          <span class="badge ${p.status}">${LABELS[p.status] || p.status}</span>
          <span class="age ${ageClass(min)}">${min === 0 ? 'agora' : min + ' min'}</span>
        </div>
      </div>
      <b>#${p.id}</b>
    </div>
    <hr>
    ${itens || '<p class="muted">Sem itens</p>'}
    ${p.observacao_geral ? `<p><b>Obs. geral:</b> ${esc(p.observacao_geral)}</p>` : ''}
    <p class="muted">${fmtHora(p.criado_em)}</p>
    <div class="nav">
      ${
        proximo
          ? `<button class="btn primary" data-advance="${p.id}" data-status="${proximo}">${acao}</button>`
          : ''
      }
    </div>
  </article>`;
}

function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    el.className = 'toast';
  }, 2200);
}

let advancing = false;

const load = (window.LQRRealtime && LQRRealtime.createLoader
  ? LQRRealtime.createLoader
  : (fn) => {
      let loading = false, dirty = false;
      return async function load() {
        if (loading) { dirty = true; return; }
        loading = true;
        try { do { dirty = false; await fn(); } while (dirty); }
        finally { loading = false; }
      };
    })(async () => {
  if (advancing) return;
  const res = await fetch('/api/cozinha/pedidos');
  if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent('/cozinha'); return; }
  if (!res.ok) throw new Error('Falha ao carregar fila');
  const pedidos = await res.json();

  const novos = pedidos.filter((p) => p.status === 'recebido').length;
  const prep = pedidos.filter((p) => p.status === 'em_producao').length;
  document.getElementById('stats').textContent = pedidos.length
    ? `${pedidos.length} na fila · ${novos} novo(s) · ${prep} em produção`
    : 'Fila vazia';

  const root = document.getElementById('orders');
  if (!pedidos.length) {
    root.innerHTML =
      '<div class="panel empty-state"><div class="big">✅</div><div>Nenhum pedido na fila da cozinha.</div></div>';
  } else {
    root.innerHTML = pedidos.map(card).join('');
  }
});

async function avancar(id, status) {
  if (advancing) return;
  advancing = true;
  const btn = document.querySelector(`[data-advance="${id}"]`);
  if (btn) {
    btn.disabled = true;
    btn.textContent = '…';
  }
  const art = document.querySelector(`article[data-id="${id}"]`);
  if (art && status === 'concluido') art.remove();
  else if (art && status === 'em_producao') {
    const badge = art.querySelector('.badge');
    if (badge) { badge.className = 'badge em_producao'; badge.textContent = LABELS.em_producao; }
    const nav = art.querySelector('.nav');
    if (nav) nav.innerHTML = `<button class="btn primary" data-advance="${id}" data-status="concluido">${ACAO.em_producao}</button>`;
  }
  try {
    const res = await fetch(`/api/pedidos/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      toast(data.error || 'Não foi possível avançar o status', true);
      await load();
      return;
    }
    toast(status === 'em_producao' ? 'Pedido em preparo' : 'Pedido concluído — aguardando garçom');
    await load();
  } catch (e) {
    console.error(e);
    toast('Erro de rede', true);
    await load();
  } finally {
    advancing = false;
  }
}

document.getElementById('orders').addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-advance]');
  if (!btn) return;
  avancar(Number(btn.dataset.advance), btn.dataset.status);
});

load();
if (window.LQRRealtime) {
  LQRRealtime.connect(() => load(), { fallbackMs: 20000, debounceMs: 120 });
} else if (typeof EventSource !== 'undefined') {
  const es = new EventSource('/api/events');
  es.addEventListener('update', () => load());
  es.addEventListener('hello', () => load());
  setInterval(load, 15000);
} else {
  setInterval(load, 3000);
}
</script>
</body>
</html>
