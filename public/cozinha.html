<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><div class="top"><div><div class="brand">👨‍🍳 Cozinha</div><div class="muted">Pedidos atualizados automaticamente</div></div><a class="btn primary" href="/mesa/1">Cardápio</a></div><div id="orders" class="kgrid"></div></main><script>const labels={PENDING:'Novo',PREPARING:'Preparando',READY:'Pronto',DELIVERED:'Entregue',CANCELLED:'Cancelado'};async function load(){let o=await(await fetch('/api/orders')).json();document.getElementById('orders').innerHTML=o.length?o.map(x=>`<article class="order ${x.status==='PENDING'?'new':''}"><div class="row"><div><div class="big">Mesa ${x.table}</div><span class="badge">${labels[x.status]}</span></div><b>#${x.id}</b></div><hr>${x.items.map(i=>`<div class="row"><span><b>${i.qty}×</b> ${i.name}</span><span>R$ ${(i.price*i.qty).toFixed(2).replace('.',',')}</span></div>`).join('')}${x.note?`<p><b>Obs.:</b> ${x.note}</p>`:''}<p class="muted">${new Date(x.createdAt).toLocaleTimeString('pt-BR')}</p><div class="nav">${x.status==='PENDING'?`<button class="btn primary" onclick="setStatus(${x.id},'PREPARING')">Começar</button>`:''}${x.status==='PREPARING'?`<button class="btn primary" onclick="setStatus(${x.id},'READY')">Marcar pronto</button>`:''}${x.status==='READY'?`<button class="btn dark" onclick="setStatus(${x.id},'DELIVERED')">Entregue</button>`:''}${!['DELIVERED','CANCELLED'].includes(x.status)?`<button class="btn" onclick="setStatus(${x.id},'CANCELLED')">Cancelar</button>`:''}</div></article>`).join(''):'<div class="panel">Nenhum pedido ainda.</div>'}async function setStatus(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}load();setInterval(load,2000)</script></body></html>
