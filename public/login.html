<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>Login · Restaurant OS</title>
<link rel="icon" type="image/svg+xml" href="/favicons/login.svg">
<link rel="stylesheet" href="/ros/tokens.css">
<link rel="stylesheet" href="/ros/components.css">
<link rel="stylesheet" href="/ros/polish.css">
</head>
<body class="ros">
<div class="ros-login-page">
  <section class="ros-login-card" aria-labelledby="login-title">
    <!-- [PLACE RESTAURANT LOGO HERE] -->
    <div class="ros-logo-slot" title="Logo do restaurante">LOGO</div>
    <h1 id="login-title">Área da equipe</h1>
    <p class="lede">Restaurant OS · admin, cozinha e caixa</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label class="ros-label" for="usuario">Usuário</label>
        <input class="ros-input" type="text" id="usuario" name="usuario" autocomplete="username" autofocus required placeholder="admin">
      </div>
      <div class="field">
        <label class="ros-label" for="senha">Senha</label>
        <input class="ros-input" type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button class="ros-btn ros-btn--action ros-btn--block" type="submit" style="margin-top:8px">Entrar</button>
    </form>
    <div id="erro" class="ros-login-error" role="alert" aria-live="assertive"></div>
    <p style="margin:18px 0 0;font-size:var(--ros-xs);color:var(--ros-text-muted);line-height:1.45">
      Após migrate: <code style="color:var(--ros-gold)">admin</code>, <code style="color:var(--ros-gold)">cozinha</code>, <code style="color:var(--ros-gold)">caixa</code>
    </p>
  </section>
  <a class="ros-login-back" href="/">← Início</a>
</div>

<script src="/js/safe-dom.js"></script>
<script>
const params = new URLSearchParams(location.search);
const nextParam = params.get('next');
const form = document.getElementById('loginForm');
const erroEl = document.getElementById('erro');
const btn = form.querySelector('button');

function destinoPadrao(home, next) {
  if (!next || next === '/' || next === '/login') return home || '/admin';
  if (next.startsWith('/') && !next.startsWith('//')) return next;
  return home || '/admin';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erroEl.className = 'ros-login-error';
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        senha: document.getElementById('senha').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      erroEl.textContent = data.error || 'Não foi possível entrar';
      erroEl.className = 'ros-login-error show';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }
    location.href = destinoPadrao(data.home, nextParam);
  } catch (err) {
    erroEl.textContent = 'Erro de rede. Tente novamente.';
    erroEl.className = 'ros-login-error show';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
